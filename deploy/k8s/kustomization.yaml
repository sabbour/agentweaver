# Compose the complete v1 P0 installation from reviewed manifests and release-pinned images.
# Operator-owned credentials, certificates, and approved Gateway placement remain external.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentweaver
resources:
  - base
  - provider-catalogs/projects-config-provider-catalog.json
  - runtime-configs/identity-broker-runtime-config.json
  - runtime-configs/environment-runtime-config.json
  - runtime-configs/environment-cilium-config.json
  - runtime-configs/orchestrator-runtime-config.json
  - runtime-configs/events-and-sessions-runtime-config.json
  - runtime-configs/gateway-runtime-config.json
  - runtime-configs/mcp-runtime-config.json
  - runtime-configs/web-runtime-config.json
  - runtime-configs/knowledge-runtime-config.json
  - runtime-configs/projects-config-runtime-config.json
  - profiles/agenthost/runtime-config.example.yaml
  - routing/identity-broker/gateway-api-ingress.yaml
  - routing/identity-broker/mcp-gateway-ingress.yaml
  - routing/identity-broker/web-gateway-ingress.yaml
  # Bind the P0 Web origin to its dedicated AKS-managed Gateway listener.
  - routing/identity-broker/web-application-p0.yaml
configurations:
  - kustomizeconfig/image-env.yaml
images:
  - name: ghcr.io/sabbour/agentweaver-agenthost
    newName: ghcr.io/sabbour/agentweaver-agenthost
    digest: sha256:f6d22c6170e3a0d5a3d2d071cd546220c4742771abc091c237f691df63c83025
  - name: ghcr.io/sabbour/agentweaver.identity.broker
    newName: ghcr.io/sabbour/agentweaver.identity.broker
    digest: sha256:9452b1bb82803ecf5dfa35fc2228ff9d68b3d0998ada58ec6a8e46269e399585
  - name: ghcr.io/sabbour/agentweaver.eventsandsessions
    newName: ghcr.io/sabbour/agentweaver.eventsandsessions
    digest: sha256:d4c5af4ce384c1e1644dcd6d23e57afd4beba5f661c4fbbd82caeef6c123d458
  - name: ghcr.io/sabbour/agentweaver.gateway
    newName: ghcr.io/sabbour/agentweaver.gateway
    digest: sha256:a10f24fd847409ffca6c328e8206898e46c81caeb9b19aed4386157ba7e7f4a6
  - name: ghcr.io/sabbour/agentweaver.mcp
    newName: ghcr.io/sabbour/agentweaver.mcp
    digest: sha256:734eb02c991adbe81624ea07ae1c5e057292d6789dd64af76e61fddce2187026
  - name: ghcr.io/sabbour/agentweaver-web
    newName: ghcr.io/sabbour/agentweaver-web
    digest: sha256:c48373e00f43c1c2052507ac1393ca09d5f818cf284f3ab28e7576f0fd6c4d2a
  - name: ghcr.io/sabbour/agentweaver.orchestrator
    newName: ghcr.io/sabbour/agentweaver.orchestrator
    digest: sha256:9cf0fc02d816703ad52a2e70ac310b921385ac5c75230f12a2171c83ecd3a9d1
  - name: ghcr.io/sabbour/agentweaver.environment
    newName: ghcr.io/sabbour/agentweaver.environment
    digest: sha256:5371b561e8e262134aad50d8aa610a3c9b2308ca4d20576902967843c8b87f96
  - name: ghcr.io/sabbour/agentweaver.knowledge
    newName: ghcr.io/sabbour/agentweaver.knowledge
    digest: sha256:256dd83a1f66b5a3c9a69e3e7db32fb6bffd03dc0cf8c6258fafc50bc8b2f27e
  - name: ghcr.io/sabbour/agentweaver.projects.config
    newName: ghcr.io/sabbour/agentweaver.projects.config
    digest: sha256:715eeb38463f8688fee41cdff7b2c81ce78aa14ff1acb04f8ff41a15fa69813b
patches:
  # Resolve the existing Broker egress template from its non-secret P0 runtime settings.
  - target:
      group: cilium.io
      version: v2
      kind: CiliumNetworkPolicy
      name: identity-broker-egress
    patch: |-
      - op: replace
        path: /spec/egress/0/toPorts/0/rules/dns/2/matchName
        value: agentweaver-pg.postgres.database.azure.com
      - op: replace
        path: /spec/egress/0/toPorts/0/rules/dns/3/matchName
        value: login.microsoftonline.com
      - op: replace
        path: /spec/egress/0/toPorts/0/rules/dns/4/matchName
        value: login.microsoftonline.com
      - op: replace
        path: /spec/egress/2/toFQDNs/1/matchName
        value: login.microsoftonline.com
      - op: replace
        path: /spec/egress/2/toFQDNs/2/matchName
        value: login.microsoftonline.com
      - op: replace
        path: /spec/egress/3/toFQDNs/0/matchName
        value: agentweaver-pg.postgres.database.azure.com
      - op: remove
        path: /spec/egress/0/toPorts/0/rules/dns/4
      - op: remove
        path: /spec/egress/0/toPorts/0/rules/dns/3
      - op: remove
        path: /spec/egress/2/toFQDNs/2
      - op: remove
        path: /spec/egress/2/toFQDNs/1
replacements:
  - source:
      kind: ConfigMap
      name: identity-broker-runtime-config-v2
      fieldPath: data.IdentityBroker__SecretRedemption__VaultHost
    targets:
      - select:
          group: cilium.io
          version: v2
          kind: CiliumNetworkPolicy
          name: identity-broker-egress
        fieldPaths:
          - spec.egress.0.toPorts.0.rules.dns.1.matchName
          - spec.egress.2.toFQDNs.0.matchName
  - source:
      kind: ConfigMap
      name: identity-broker-runtime-config-v2
      fieldPath: data.IdentityBroker__SecretRedemption__WorkloadIdentityClientId
    targets:
      - select:
          kind: ServiceAccount
          name: identity-broker
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
  - source:
      kind: ConfigMap
      name: identity-broker-runtime-config-v2
      fieldPath: data.IdentityBroker__SecretRedemption__WorkloadIdentityTenantId
    targets:
      - select:
          kind: ServiceAccount
          name: identity-broker
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/tenant-id]
  - source:
      kind: ConfigMap
      name: environment-runtime-config
      fieldPath: data.Environment__Database__WorkloadIdentity__ClientId
    targets:
      - select:
          kind: ServiceAccount
          name: environment
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
  - source:
      kind: ConfigMap
      name: environment-runtime-config
      fieldPath: data.Environment__Database__WorkloadIdentity__TenantId
    targets:
      - select:
          kind: ServiceAccount
          name: environment
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/tenant-id]
  - source:
      kind: ConfigMap
      name: events-and-sessions-runtime-config
      fieldPath: data.EventsAndSessions__Database__WorkloadIdentity__ClientId
    targets:
      - select:
          kind: ServiceAccount
          name: events-and-sessions
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
  - source:
      kind: ConfigMap
      name: events-and-sessions-runtime-config
      fieldPath: data.EventsAndSessions__Database__WorkloadIdentity__TenantId
    targets:
      - select:
          kind: ServiceAccount
          name: events-and-sessions
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/tenant-id]
  - source:
      kind: ConfigMap
      name: orchestrator-runtime-config
      fieldPath: data.Orchestrator__Database__WorkloadIdentity__ClientId
    targets:
      - select:
          kind: ServiceAccount
          name: orchestrator
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
  - source:
      kind: ConfigMap
      name: orchestrator-runtime-config
      fieldPath: data.Orchestrator__Database__WorkloadIdentity__TenantId
    targets:
      - select:
          kind: ServiceAccount
          name: orchestrator
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/tenant-id]
  - source:
      kind: ConfigMap
      name: knowledge-runtime-config
      fieldPath: data.Knowledge__Database__WorkloadIdentity__ClientId
    targets:
      - select:
          kind: ServiceAccount
          name: knowledge
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
  - source:
      kind: ConfigMap
      name: knowledge-runtime-config
      fieldPath: data.Knowledge__Database__WorkloadIdentity__TenantId
    targets:
      - select:
          kind: ServiceAccount
          name: knowledge
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/tenant-id]
  - source:
      kind: ConfigMap
      name: projects-config-runtime-config
      fieldPath: data.ProjectsConfig__Database__WorkloadIdentity__ClientId
    targets:
      - select:
          kind: ServiceAccount
          name: projects-config
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
  - source:
      kind: ConfigMap
      name: projects-config-runtime-config
      fieldPath: data.ProjectsConfig__Database__WorkloadIdentity__TenantId
    targets:
      - select:
          kind: ServiceAccount
          name: projects-config
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/tenant-id]
