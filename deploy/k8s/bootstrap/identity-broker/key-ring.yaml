apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-broker-key-ring
  namespace: agentweaver
  labels:
    agentweaver.io/service: identity-broker
    agentweaver.io/managed-by: installer
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
