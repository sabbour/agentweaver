# Cluster-scoped workspace StorageClass. The namespaced root bundle does not include it.
# npm run deploy:kustomize creates it when it is missing.
# The Azure Files workspace provider requires this provisioner and exactly these mount options.
# StorageClass parameters and mount options cannot change after creation.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: agentweaver-workspace-azurefile
provisioner: file.csi.azure.com
parameters:
  skuName: Standard_LRS
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - dir_mode=0755
  - file_mode=0644
  - uid=1000
  - gid=1000
  - mfsymlinks
  - cache=strict
  - actimeo=30
