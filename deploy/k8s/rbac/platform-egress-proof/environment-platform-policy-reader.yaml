apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: environment-platform-policy-reader
  namespace: agentweaver
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    verbs:
      - list
  - apiGroups:
      - cilium.io
    resources:
      - ciliumnetworkpolicies
    verbs:
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: environment-platform-policy-reader
  namespace: agentweaver
subjects:
  - kind: ServiceAccount
    name: environment
    namespace: agentweaver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: environment-platform-policy-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: environment-platform-policy-reader
rules:
  - apiGroups:
      - cilium.io
    resources:
      - ciliumclusterwidenetworkpolicies
    verbs:
      - list
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - agentweaver
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: environment-platform-policy-reader
subjects:
  - kind: ServiceAccount
    name: environment
    namespace: agentweaver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: environment-platform-policy-reader
