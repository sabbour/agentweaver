# Runtime identities are populated from each service's non-secret P0 ConfigMap.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: events-and-sessions
  labels:
    azure.workload.identity/use: "true"
    agentweaver.io/service: events-and-sessions
  annotations:
    azure.workload.identity/client-id: CHANGEME-events-and-sessions-client-id
    azure.workload.identity/tenant-id: CHANGEME-tenant-id
automountServiceAccountToken: true
