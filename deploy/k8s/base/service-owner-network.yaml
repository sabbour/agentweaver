apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gateway-owner-network
  namespace: agentweaver-v1-p0
  labels:
    agentweaver.io/service: gateway
spec:
  endpointSelector:
    matchLabels:
      agentweaver.io/workload: gateway
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentweaver-v1-p0
            agentweaver.io/workload: mcp
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentweaver-v1-p0
            agentweaver.io/workload: orchestrator
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentweaver-v1-p0
            agentweaver.io/workload: identity-broker
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentweaver-v1-p0
            agentweaver.io/workload: projects-config
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentweaver-v1-p0
            agentweaver.io/workload: knowledge
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentweaver-v1-p0
            agentweaver.io/workload: events-and-sessions
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
