apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-broker
  namespace: agentweaver
  labels:
    app.kubernetes.io/name: identity-broker
    agentweaver.io/service: identity-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-broker
        agentweaver.io/service: identity-broker
        agentweaver.io/workload: identity-broker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: identity-broker
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: identity-broker
          image: ghcr.io/sabbour/agentweaver.identity.broker:receipt-pinned
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: hosted-catalog
              containerPort: 8444
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: https://+:8443
            - name: Kestrel__Endpoints__Https__Url
              value: https://+:8443
            - name: Kestrel__Endpoints__HostedModelCatalogCredentialUse__Url
              value: https://+:8444
            - name: ASPNETCORE_Kestrel__Certificates__Default__Path
              value: /var/run/identity-broker-tls/tls.crt
            - name: ASPNETCORE_Kestrel__Certificates__Default__KeyPath
              value: /var/run/identity-broker-tls/tls.key
            - name: IdentityBroker__Signing__PfxPath
              value: /var/run/identity-broker-signing/signing.pfx
            - name: IdentityBroker__Signing__PfxPassword
              valueFrom:
                secretKeyRef:
                  name: identity-broker-signing
                  key: password
                  optional: false
          envFrom:
            - configMapRef:
                # The v2 name change rolls the pod instead of mutating an immutable ConfigMap.
                name: identity-broker-runtime-config-v3
                optional: false
            - secretRef:
                name: identity-broker-client-secrets
                optional: true
          volumeMounts:
            - name: tls-certificate
              mountPath: /var/run/identity-broker-tls
              readOnly: true
            - name: hosted-catalog-tls
              mountPath: /var/run/identity-broker-agenthost-tls
              readOnly: true
            - name: projects-ca
              mountPath: /var/run/service-backend-ca
              readOnly: true
            - name: signing-material
              mountPath: /var/run/identity-broker-signing
              readOnly: true
            - name: key-ring
              mountPath: /var/lib/identity-broker/key-ring
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/live
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      volumes:
        - name: tls-certificate
          secret:
            secretName: identity-broker-tls
            optional: false
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: hosted-catalog-tls
          secret:
            secretName: identity-broker-agenthost-tls
            optional: true
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: signing-material
          secret:
            secretName: identity-broker-signing
            optional: false
            defaultMode: 0440
            items:
              - key: signing.pfx
                path: signing.pfx
        - name: projects-ca
          configMap:
            name: service-backend-ca
            optional: false
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        - name: key-ring
          persistentVolumeClaim:
            claimName: identity-broker-key-ring
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
