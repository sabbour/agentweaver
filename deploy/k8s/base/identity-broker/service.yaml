apiVersion: v1
kind: Service
metadata:
  name: identity-broker
  namespace: agentweaver
  labels:
    app.kubernetes.io/name: identity-broker
    agentweaver.io/service: identity-broker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: identity-broker
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: hosted-catalog
      port: 8444
      targetPort: hosted-catalog
      protocol: TCP
