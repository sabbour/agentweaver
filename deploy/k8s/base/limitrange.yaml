apiVersion: v1
kind: LimitRange
metadata:
  name: agentweaver-limits
  namespace: agentweaver
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 2Gi
      min:
        cpu: 25m
        memory: 32Mi
