apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: identity-broker-auth
  namespace: agentweaver
  labels:
    agentweaver.io/service: identity-broker
spec:
  parentRefs:
    - name: identity-broker
      namespace: agentweaver-gateway
      sectionName: auth
  hostnames:
    - CHANGEME-AUTH-HOST
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: identity-broker
          port: 443
