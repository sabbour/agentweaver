apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: gateway-api
  namespace: agentweaver
  labels:
    agentweaver.io/service: gateway
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: gateway
      sectionName: https
  validation:
    hostname: gateway.agentweaver.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: service-backend-ca
