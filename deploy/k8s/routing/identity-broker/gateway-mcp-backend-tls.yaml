apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: mcp
  namespace: agentweaver
  labels:
    agentweaver.io/service: mcp
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: mcp
      sectionName: https
  validation:
    hostname: mcp.agentweaver.svc.cluster.local
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: service-backend-ca
