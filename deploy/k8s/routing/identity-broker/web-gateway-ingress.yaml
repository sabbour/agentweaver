apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: web-gateway-ingress
  namespace: agentweaver
  labels:
    agentweaver.io/service: web
spec:
  endpointSelector:
    matchLabels:
      agentweaver.io/workload: web
  ingress:
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentweaver-gateway
            k8s:gateway.networking.k8s.io/gateway-name: identity-broker
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
