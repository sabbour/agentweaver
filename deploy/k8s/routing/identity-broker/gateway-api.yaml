apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-api
  namespace: agentweaver-v1-p0
  labels:
    agentweaver.io/service: gateway
spec:
  parentRefs:
    - name: identity-broker
      namespace: CHANGEME-GATEWAY-NAMESPACE
      sectionName: portal
  hostnames:
    - CHANGEME-PORTAL-HOST
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
        - path:
            type: Exact
            value: /openapi/v1.json
      backendRefs:
        - name: gateway
          port: 8443
