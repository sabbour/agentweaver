apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-copilot-bff
  namespace: agentweaver
  labels:
    agentweaver.io/service: gateway
spec:
  parentRefs:
    - name: identity-broker
      namespace: agentweaver-gateway
      sectionName: https
  hostnames:
    - CHANGEME-PORTAL-HOST
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/connections/copilot-user/v1
      backendRefs:
        - name: gateway
          port: 8443
