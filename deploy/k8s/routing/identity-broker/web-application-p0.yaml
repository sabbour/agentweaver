apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-application
  namespace: agentweaver
  labels:
    agentweaver.io/service: web
spec:
  parentRefs:
    - name: identity-broker
      namespace: agentweaver-gateway
      sectionName: https
  hostnames:
    - portal.6ad4aaa13923a30001c83518.eastus2euap.aksapp.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
