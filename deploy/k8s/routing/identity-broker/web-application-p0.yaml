apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-application
  namespace: agentweaver-v1-p0
  labels:
    agentweaver.io/service: web
spec:
  parentRefs:
    - name: identity-broker
      namespace: agentweaver-v1-gateway
      sectionName: portal
  hostnames:
    - portal.6ac31fa7dd86cf00014876f0.eastus2euap.aksapp.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
