apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
  namespace: agentweaver-v1-p0
  labels:
    agentweaver.io/service: mcp
spec:
  parentRefs:
    - name: identity-broker
      namespace: CHANGEME-GATEWAY-NAMESPACE
      sectionName: portal
  hostnames:
    - CHANGEME-PORTAL-HOST
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource/mcp
      backendRefs:
        - name: mcp
          port: 8443
