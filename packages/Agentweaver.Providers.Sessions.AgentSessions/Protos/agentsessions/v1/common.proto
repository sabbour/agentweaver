// Shared wire types for the agentsessions Session and Harness services.
//
// The Event message is used by BOTH the session log (Sessions.Exec / Replay) and the
// harness stream (Harness.Connect) — durable harness events become the log alongside host-owned
// records. EVENT_PARKED is a transport-only acknowledgement and is never journaled.
//
// The content model (Part) is aligned with A2A `Part` + MCP content for interop; the
// event/log model is native. Derived from the durable-log & replay contract §7 (record
// schema) and §8 (interop). See agentsessions-replay-determinism-contract.md.
syntax = "proto3";

package agentsessions.v1;

option go_package = "github.com/agent-primitives/sessions/api/genpb;agentsessionsv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

// ResourceMetadata is carried by every top-level resource.
message ResourceMetadata {
  string project = 1; // tenant / namespace
  string name = 2;
  string uid = 3;
  int64 version = 4;
  google.protobuf.Timestamp create_time = 5;
  google.protobuf.Timestamp update_time = 6;
}

// ---- Content model (A2A Part + MCP-aligned; multimodal + reasoning) ----

// Part is one unit of message content. Text, file (inline or URI), structured data, or an
// opaque reasoning block. Large payloads are externalized by URI, never inlined (§8).
message Part {
  oneof part {
    TextPart text = 1;
    FilePart file = 2;
    DataPart data = 3;
    ReasoningPart reasoning = 4;
    // tool_call is a model's request to call a tool, carried in an assistant message. It reuses
    // ToolCall so one id runs from the model output through EVENT_TOOL_CALL / EVENT_TOOL_RESULT to the
    // next model input. On a model output, mediation and idempotency_key are unset; to execute the
    // call, the harness sets them on a copy and never changes the recorded output's ToolCall.
    ToolCall tool_call = 5;
    // tool_result is a tool's result fed back to the model, carried in a message with role "tool".
    // ToolResult.id is the id of the ToolCall it answers.
    ToolResult tool_result = 6;
  }
}

message TextPart {
  string text = 1;
}

// FilePart carries binary/media content inline or by reference (A2A file part; MCP
// resource_link / embedded resource). mime is an IANA media type.
message FilePart {
  string mime = 1;
  oneof source {
    bytes bytes = 2;
    string uri = 3;
  }
  string name = 4;   // optional display name
  string digest = 5; // content digest of the uri target (chain covers externalized bytes)
}

// DataPart is structured JSON (A2A data part; MCP structuredContent).
message DataPart {
  google.protobuf.Struct data = 1;
}

// ReasoningPart is an opaque, provider-tagged reasoning block that MUST be replayed
// verbatim to preserve reasoning continuity within a turn (I2). agentsessions never
// interprets `opaque` — all provider specifics live inside it. Verified across
// Anthropic/OpenAI/Gemini in the Track A reasoning-continuity spike: one part type, no
// per-provider sub-shapes, and no memory-snapshot edge (stateless verbatim replay).
message ReasoningPart {
  string provider = 1; // "anthropic" | "openai" | "google" — routing + validation
  string model_id = 2; // model that produced it (cross-model resend case)
  oneof opaque {        // signature / encrypted_content / thought signature, VERBATIM
    bytes opaque_bytes = 3;
    string opaque_uri = 4; // externalized when large; retained for the turn's fork lifetime
  }
  repeated Part summary = 5; // optional, NON-authoritative, compaction-droppable (may be multimodal)
  string item_id = 6;        // optional provider id (e.g. OpenAI rs_...) for dedup/order
  int32 ordinal = 7;         // position within the turn relative to text/tool parts
  string validity_scope = 8; // = execution_id (turn); see replay contract §5
  string opaque_digest = 9;  // content digest of opaque_uri target (chain covers externalized bytes)
}

// Message is a role-tagged sequence of content parts (A2A Message = role + Part[]).
message Message {
  string role = 1; // system, user, assistant, or tool
  repeated Part parts = 2;
}

// ---- Identity / origin ----

// IdentityRef is the bound agent principal. OIDC-neutral: an Entra Agent ID is one issuer;
// a SPIFFE ID or a GitHub App identity are others. Carried on every event.
message IdentityRef {
  string principal = 1;
  string issuer = 2;
  string subject = 3; // session-scoped sub
}

// Origin is the neutral external context a session is tied to. Producer adapters
// (GitHub, Foundry, custom apps) fill it. Modeled on CloudEvents source/subject.
message Origin {
  string source = 1;
  string subject = 2;
  string uri = 3;
  map<string, string> attributes = 4;
}

// ---- Tool / model / approval / usage ----

// Mediation controls how a tool call is executed / who enforces record-before-effect (§3).
enum Mediation {
  MEDIATION_UNSPECIFIED = 0;
  MEDIATION_IN_HARNESS_REPORTED = 1; // harness runs it, reports for audit (cooperative WAL)
  MEDIATION_CONTROLLER_MEDIATED = 2; // host/gateway executes (host-enforced WAL; trustless)
  // Host-owned durable approval gate for STATELESS_REPLAY only. The harness emits a tool call,
  // then awaits a decision/receipt or park control frame; it never executes the effect itself.
  // REQUIRES_MEMORY_SNAPSHOT is unsupported for this gate and fails closed before the effect.
  MEDIATION_REQUIRES_APPROVAL = 3;
}

// ModelCall is a model REQUEST emitted by the harness (EVENT_MODEL_CALL). The host records
// it with input_hash and answers via ControllerFrame.ModelResult (correlated by id). The
// completion (text, reasoning, and tool_call parts) is recorded separately as an EVENT_OUTPUT
// message. Under STATELESS_REPLAY the harness never calls a provider directly.
message ModelCall {
  string model = 1;
  map<string, string> params = 2;
  string input_hash = 3; // §7/§9.1: required for STATELESS_REPLAY so the I0 check can run
  string id = 4;         // correlation id for the served ModelResult
  // messages is the request context the host needs to INVOKE the model on the live path. It is
  // wire-only: the host records the call with input_hash alone (messages stripped), since the
  // recorded form only needs the hash to re-check I0 on replay.
  repeated Message messages = 5;
  // tools are the definitions offered to the model on this call. Wire-only like messages: the
  // recorded form keeps input_hash, which covers them.
  repeated ToolDefinition tools = 6;
  // tool_choice constrains whether and which tool the model calls. Wire-only like messages and
  // covered by input_hash. Unset means the provider default.
  ToolChoice tool_choice = 7;
}

// ToolDefinition is a tool offered to a model on one call. It aligns with an MCP Tool (name,
// description, inputSchema). It differs from the harness's ToolSpec, which declares a tool and its
// default mediation to the host; ToolDefinition is what the model sees.
message ToolDefinition {
  string name = 1;
  string description = 2;
  google.protobuf.Struct input_schema = 3; // JSON Schema object describing the tool's arguments
}

// ToolChoice constrains whether and which tool the model calls.
message ToolChoice {
  enum Mode {
    MODE_UNSPECIFIED = 0; // provider default
    MODE_AUTO = 1;        // the model decides whether to call a tool
    MODE_NONE = 2;        // the model must not call a tool
    MODE_REQUIRED = 3;    // the model must call at least one tool
  }
  Mode mode = 1;
  // name forces one specific tool. It is meaningful only with MODE_REQUIRED.
  string name = 2;
}

message Usage {
  string model = 1;
  int64 input_tokens = 2;
  int64 output_tokens = 3;
  int64 reasoning_tokens = 4;
}

// ToolCall aligns with an MCP tool call (name + structured args).
message ToolCall {
  string id = 1;
  string tool = 2; // tool name / MCP method
  google.protobuf.Struct args = 3;
  Mediation mediation = 4;
  string idempotency_key = 5; // §3/I3: dedups a retried side-effecting call tool-side
}

// ToolResult is a durable execution receipt, also usable as model-facing history. A decision
// itself is a separate host-owned APPROVAL_RESULT; it is not embedded in this message.
message ToolResult {
  enum Code {
    // Legacy/unspecified status. With is_error=false this is also a successful receipt.
    // Old is_error=true receipts retain their legacy, unclassified failure shape.
    CODE_UNSPECIFIED = 0;
    // A denied approval: is_error=true and the executor MUST NOT have been invoked.
    APPROVAL_DENIED = 1;
    // An attempted executor call failed: is_error=true; error describes the failure. This is
    // a durable handled receipt, not an unrecorded effect or an approval denial.
    EXECUTOR_ERROR = 2;
  }
  string id = 1;
  google.protobuf.Struct output = 2;
  string output_uri = 3;    // externalized large output (MCP resource_link), else inline `output`
  string output_digest = 6; // content digest of output_uri target (chain covers externalized bytes)
  bool is_error = 4;
  string error = 5;
  // content is the model-facing result (MCP CallToolResult.content: text, file, structured data).
  // A harness records on EVENT_TOOL_RESULT the same ToolResult it feeds back as a tool_result part,
  // so history rebuilt from the journal can give the model what it saw live.
  repeated Part content = 7;
  Code code = 8;
  // For approval-gated calls, the positive journal sequences of the host-owned request and
  // decision. Both are set on success, denial, or executor failure after approval. Other calls
  // and legacy receipts leave both zero. The host checks these against the same session,
  // execution_id and tool call id; a receipt cannot resolve a different request/decision.
  int64 approval_request_seq = 9;
  int64 approval_decision_seq = 10;
}

// Approval is durable journal state, not a mutable session flag or side table. For a
// REQUIRES_APPROVAL call the host commits TOOL_CALL then APPROVAL_REQUEST before parking;
// only the host may commit the request or its later APPROVAL_RESULT. The harness cannot mint
// requests or decisions by emitting these events. Identity on a decision's Event.actor is
// recorded provenance only, not authorization. This gate supports STATELESS_REPLAY only;
// it defines no policy hook, expiry, automatic decision, or Cancel behavior.
message ApprovalRequest {
  string tool_call_id = 1;
  string reason = 2;
}

// ApprovalResult resolves one request in the enclosing session and Event.execution_id.
// A committed decision allows recovery via Resume; Approve itself never invokes the executor.
// The host also sends this body in ControllerFrame.approval before the correlated tool receipt
// during decided recovery/replay. approved=false is a real denial, not an absent decision.
message ApprovalResult {
  string tool_call_id = 1;
  bool approved = 2; // non-optional durable value; request-level decision presence is in ApproveRequest
  string reason = 3;
  // Positive sequence of the resolved APPROVAL_REQUEST. Zero is retained for legacy decisions;
  // it cannot identify a new durable approval request.
  int64 request_seq = 4;
}

// ApprovalRef identifies an unresolved, host-owned APPROVAL_REQUEST within the enclosing
// session. All fields are required by the approval protocol and request_seq must be positive.
// A reference inherited through Fork cannot authorize a new effect in the child session.
message ApprovalRef {
  string execution_id = 1;
  string tool_call_id = 2;
  int64 request_seq = 3;
}

message Error {
  int32 code = 1; // grpc status code
  string description = 2;
}

message HarnessEnd {
  string state = 1; // COMPLETED | FAILED | CANCELED
  Error error = 2;
}

// Lifecycle marks a compute/session transition in the log (§7). BASELINE is a replay /
// compaction checkpoint (§1).
message Lifecycle {
  enum Kind {
    LIFECYCLE_UNSPECIFIED = 0;
    LIFECYCLE_SUSPEND = 1;
    LIFECYCLE_RESUME = 2;
    LIFECYCLE_FORK = 3;
    LIFECYCLE_BASELINE = 4;
    LIFECYCLE_CANCEL = 5;
    // Host-owned, session-scoped permanent deletion intent (empty Event.execution_id).
    // It fences writes but does not terminate compute or confirm resource reclamation.
    LIFECYCLE_DELETE = 6;
  }
  Kind kind = 1;
  string detail = 2; // e.g. "fork parent=<uid>@<seq>", baseline id
  // SnapshotRef captured on SUSPEND (§5.1), carried inline (mirroring the canonical api.SnapshotRef)
  // so it rides the tamper-evident chain with no side table and no cross-file message dependency.
  // This is distinct from the aspirational session-status message SnapshotRef in session.proto. A
  // filesystem-only backend sets only snapshot_local (the session handle to replay) with
  // snapshot_memory=false; a memory backend also sets snapshot_external_uri.
  string snapshot_local = 3;
  string snapshot_external_uri = 4;
  bool snapshot_memory = 5;
  bool snapshot_sealed = 6;
  // Set only on FORK: the identity of the compute instance the child was cloned onto, in the
  // same form as ExecutionStart.compute_instance (substrate: the cloned actor's UID). The child's
  // turns are compared with it until the child records one of its own, so a turn, Resume,
  // Suspend or Fork placed on another instance before the child's first turn is refused. Empty
  // means not recorded (a stateless fork, or a marker written before this field existed), and
  // the child's first turn is not compared.
  string compute_instance = 7;
}

// ExecutionStart is host-owned invocation state, committed before inputs and harness execution.
// The host emits it for every new execution, including default-config and inputless turns.
// Logs without this event reconstruct with empty config and a zero cursor. Older discarded
// non-empty values cannot be recovered. Config is opaque: preserve bytes verbatim, never parse it.
message ExecutionStart {
  bytes config = 1;
  int64 resume_from_seq = 2; // harness cursor, distinct from the append CAS cursor
  // Expected number of INPUT events for this invocation, always set by new writers (including zero).
  // Replay/resume reject a completed or selected invocation with a missing/negative count or a
  // different committed INPUT count before running the harness. An incomplete trailing invocation
  // is skipped by completed replay. Count-less experimental start markers fail closed; truly
  // markerless legacy executions retain their existing reconstruction behavior.
  optional int64 input_count = 3;
  // Host-resolved registry name used for this execution, not necessarily HarnessDescriptor.id.
  // Interrupted Resume resolves this exact name; absent legacy names use the session harness.
  string harness = 4;
  // Advertised, opaque harness replay-compatibility version. Empty means unknown/unversioned.
  // When nonempty, controller replay and interrupted resume require an exact served-version
  // match (including rejection of an empty served version) before running the harness.
  // Empty recorded versions retain existing behavior; this field is opt-in, not required.
  string harness_version = 5;
  // Opaque identity of the compute instance the turn was placed on, set only when the harness keeps
  // its state in that instance's memory (REQUIRES_MEMORY_SNAPSHOT) and the backend can tell two
  // instances behind the same name apart (substrate: the actor's server-assigned UID). The host
  // refuses a later turn, or a Resume, whose compute reports a different identity than the latest
  // one recorded on that harness since the session's FORK marker (or, before a fork child's first
  // turn, the clone the marker recorded in Lifecycle.compute_instance): the state is gone. Empty
  // means not recorded, and such a turn is not compared.
  string compute_instance = 6;
}

// ---- Event ----

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_INPUT = 1;            // a user/producer message
  EVENT_MODEL_CALL = 2;       // model-call metadata (+ input_hash); output is an OUTPUT message
  EVENT_OUTPUT = 3;           // a finalized assistant message; streaming deltas are transport, not logged
  EVENT_TOOL_CALL = 4;
  EVENT_TOOL_RESULT = 5;
  EVENT_APPROVAL_REQUEST = 6;
  EVENT_APPROVAL_RESULT = 7;
  EVENT_USAGE = 8;
  EVENT_LIFECYCLE = 9;
  EVENT_END = 10;
  EVENT_ERROR = 11;
  EVENT_EXECUTION_START = 12; // host-owned config/cursor/input count, before inputs and harness effects
  // Harness acknowledgement of ControllerFrame.park with the exact ApprovalRef. Transport only:
  // the host MUST NOT journal/hash-chain it or treat it as a terminal execution outcome.
  EVENT_PARKED = 13;
}

// Event is the shared journal/stream content unit; EXECUTION_START, APPROVAL_REQUEST and
// APPROVAL_RESULT are host-owned journal entries. PARKED is transport only, never journaled.
// Ordering (seq) and integrity (prev_hash /
// content_hash) are host-assigned and live on LogRecord — the harness, which does not know
// seq/prev, emits a hash-free Event, so there is no circular hashing. Streaming deltas are
// transport (see Delta in session.proto) and coalesce into the finalized event (§3).
message Event {
  reserved 1, 5, 6; // moved to LogRecord: seq, prev_hash, content_hash

  string execution_id = 2; // which execution/turn produced this event
  google.protobuf.Timestamp ts = 3;
  int32 schema_version = 4; // §7: versions the body; replay survives schema skew

  EventKind kind = 7;
  oneof body {
    Message message = 8;
    ModelCall model = 9;
    ToolCall tool = 10;
    ToolResult result = 11;
    ApprovalRequest approval = 12;
    ApprovalResult approval_result = 13;
    Usage usage = 14;
    Lifecycle lifecycle = 15;
    HarnessEnd end = 16;
    Error error = 17;
    ExecutionStart execution_start = 19;
    // EVENT_PARKED echoes the park reference; Event.execution_id must match its execution_id.
    ApprovalRef parked = 20;
  }

  IdentityRef actor = 18; // emitter principal -> provenance
}

// LogRecord is the host's durable, ordered wrapper around an Event. The host assigns seq,
// links the hash-chain (content_hash = H(prev_hash || seq || canonical(event)); at a fork
// child.first.prev_hash = parent@R.content_hash), and records the incarnation fence token.
// Externalized payloads (FilePart.uri, ReasoningPart.opaque_uri, ToolResult.output_uri)
// carry their own content digest so the chain covers them by reference.
message LogRecord {
  int64 seq = 1;
  string prev_hash = 2;
  string content_hash = 3;
  int64 fence = 4;
  Event event = 5;
}
