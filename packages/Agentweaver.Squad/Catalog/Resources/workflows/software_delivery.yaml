# Software Delivery Workflow (Feature 015 US3)
# Full software delivery pipeline: plan → implement → qa test gate → RAI check → code review → build & test → human review → merge → scribe.
# The qa test gate (performed by the qa-engineer) must pass before code review, and the build & test
# gate (which runs the actual build/test suite) must pass before human review; merge and scribe are platform-appended.

id: software-delivery
name: Software Delivery
description: Full software delivery pipeline with QA test gate, RAI safety check, and code review before merge. Use for new features and significant changes that require a complete delivery cycle.
version: "1.0"

start: plan

nodes:
  - id: plan
    type: prompt
    label: Plan
    role: agent
    kind: live

  - id: implement
    type: prompt
    label: Implement
    role: agent
    kind: live

  - id: test-gate
    type: peer_review
    label: Test Gate
    role: review
    kind: live
    agent: qa-engineer
    prompt: Act as the QA gate - design and run the checks needed to confirm the implementation meets the acceptance criteria without regressions. Provide your verdict and findings inline through your review decision; they are captured in the run record and shown in the UI. Do NOT write a QA report or verification file (e.g. qa-verification.md) into the workspace. Any test code you add is a deliverable and belongs in the repository's test suite.

  - id: rai-check
    type: check
    label: RAI Check
    role: review
    kind: gate
    gate_kind: rai
    branches:
      - revise
      - safety-failed
      - no-changes
      - review

  - id: code-review
    type: prompt
    label: Code Review
    role: review
    kind: live
    prompt: Review the implementation for correctness, maintainability, and readiness for human approval.

  - id: build-test
    type: peer_review
    label: Build & Test
    role: review
    kind: live
    agent: qa-engineer
    prompt: Run the project's build and test suite. Execute all available build commands and test runners for the repository. The step passes only if build succeeds AND all tests pass. Report any failures with full error output. Do not approve if there are compilation errors, test failures, or lint errors that indicate broken code. After tests pass, if the project is a web application or service, start its development/preview server so stakeholders can access the running changes before human review. Do NOT assume a hardcoded or pre-configured port — the port is not known ahead of time and can differ per execution. Instead, discover how to run the app by inspecting the project itself (package.json scripts, Dockerfile, Makefile, README, framework defaults, etc.), start the server, and then observe the actual port it binds to from the process stdout/logs. Once the server is up and verified (e.g. with curl), register it by calling the `start_preview(port=PORT)` tool with the exact port the server actually bound to, so the preview sandbox attaches to the running process.

  - id: rubberduck
    type: check
    label: Rubberduck Review
    role: review
    kind: gate
    gate_kind: rubberduck
    branches:
      - pass
      - revise

  - id: review-gate
    type: check
    label: Review Gate
    role: review
    kind: gate
    gate_kind: human-review
    branches:
      - approved
      - request-changes
      - declined

  - id: terminal-safety-failed
    type: terminal
    label: Safety Failed
    role: plumbing
    kind: terminal

  - id: terminal-declined
    type: terminal
    label: Declined
    role: plumbing
    kind: terminal

  - id: done
    type: terminal
    label: Done
    role: plumbing
    kind: terminal

edges:
  - from: plan
    to: implement

  - from: implement
    to: test-gate

  # QA test gate: pass advances to RAI check; fail loops back to implement.
  - from: test-gate
    to: rai-check
    when: pass

  - from: test-gate
    to: implement
    when: fail

  # RAI verdict routing.
  - from: rai-check
    to: implement
    when: revise

  - from: rai-check
    to: terminal-safety-failed
    when: safety-failed

  - from: rai-check
    to: done
    when: no-changes

  - from: rai-check
    to: rubberduck
    when: review

  - from: rubberduck
    to: code-review
    when: pass

  - from: rubberduck
    to: implement
    when: revise

  # Code review flows into the mandatory build & test gate.
  - from: code-review
    to: build-test

  # Build & test gate: pass advances to human review; failures loop back to implement.
  - from: build-test
    to: review-gate
    when: approved

  - from: build-test
    to: implement
    when: request-changes

  - from: build-test
    to: terminal-declined
    when: declined

  # Human review gate routing.
  - from: review-gate
    to: done
    when: approved

  - from: review-gate
    to: implement
    when: request-changes

  - from: review-gate
    to: terminal-declined
    when: declined
