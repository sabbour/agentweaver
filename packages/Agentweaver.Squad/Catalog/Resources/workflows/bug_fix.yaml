# Bug Fix Workflow (Feature 015 US3)
# Lightweight bug fix pipeline: triage → fix → QA verification → RAI check → build & test → human review → merge → scribe.
# Optimized for quick turnaround on defects and patches, with a mandatory build/test gate and human
# RAI and human review gates before platform merge.

id: bug-fix
name: Bug Fix
description: Lightweight bug fix pipeline with triage, fix, and QA verification. Use for bug fixes, patches, and small targeted corrections that do not require a full delivery cycle.
version: "1.0"

start: triage

nodes:
  - id: triage
    type: prompt
    label: Triage
    role: agent
    kind: live
    prompt: Triage the reported issue - reproduce it, identify the root cause, and determine the fix approach and severity. Report your triage findings by calling report_outcome with a clear summary of root cause and recommended fix. Do NOT write a triage report file (e.g. triage-report.md) into the workspace; the outcome is captured in the run record. Only create or edit files that are actual deliverables of the fix.

  - id: fix
    type: prompt
    label: Fix
    role: agent
    kind: live

  - id: verify
    type: peer_review
    label: Verify
    role: review
    kind: live
    agent: qa-engineer
    prompt: Verify the fix resolves the reported defect without regressions - review the change and exercise the relevant behavior. Provide your verdict and findings inline through your review decision; they are captured in the run record and shown in the UI. Do NOT write a verification report file (e.g. qa-verification.md) into the workspace. Any test code you add is a deliverable and belongs in the repository's test suite.

  - id: rai-check
    type: check
    label: RAI Check
    role: review
    kind: gate
    gate_kind: rai
    branches:
      - revise
      - safety-failed
      - no-changes
      - review

  - id: build-test
    type: build_test
    label: Build & Test
    role: review
    kind: live
    agent: qa-engineer

  - id: human-review
    type: check
    label: Human Review
    role: review
    kind: gate
    gate_kind: human-review
    branches:
      - approved
      - request-changes
      - declined

  - id: terminal-safety-failed
    type: terminal
    label: Safety Failed
    role: plumbing
    kind: terminal

  - id: terminal-declined
    type: terminal
    label: Declined
    role: plumbing
    kind: terminal

  - id: done
    type: terminal
    label: Done
    role: plumbing
    kind: terminal

edges:
  - from: triage
    to: fix

  - from: fix
    to: verify

  # QA verification verdict routing.
  - from: verify
    to: rai-check
    when: approved

  - from: verify
    to: fix
    when: request-changes

  - from: verify
    to: terminal-declined
    when: declined

  # RAI verdict routing.
  - from: rai-check
    to: fix
    when: revise

  - from: rai-check
    to: terminal-safety-failed
    when: safety-failed

  - from: rai-check
    to: done
    when: no-changes

  - from: rai-check
    to: build-test
    when: review

  # Build & test gate: pass advances to human review; failures loop back to fix.
  - from: build-test
    to: human-review
    when: approved

  - from: build-test
    to: fix
    when: request-changes

  - from: build-test
    to: terminal-declined
    when: declined

  # Human review gate routing.
  - from: human-review
    to: done
    when: approved

  - from: human-review
    to: fix
    when: request-changes

  - from: human-review
    to: terminal-declined
    when: declined
