# Bug Fix Workflow (Feature 015 US3)
# Lightweight bug fix pipeline: triage → fix → QA verification → build & test → human review → merge → scribe.
# Optimized for quick turnaround on defects and patches, with a mandatory build/test gate and human
# review gate before merge.

id: bug-fix
name: Bug Fix
description: Lightweight bug fix pipeline with triage, fix, and QA verification. Use for bug fixes, patches, and small targeted corrections that do not require a full delivery cycle.
version: "1.0"

start: triage

nodes:
  - id: triage
    type: prompt
    label: Triage
    role: agent
    kind: live

  - id: fix
    type: prompt
    label: Fix
    role: agent
    kind: live

  - id: verify
    type: peer_review
    label: Verify
    role: review
    kind: live
    agent: qa-engineer

  - id: build-test
    type: peer_review
    label: Build & Test
    role: review
    kind: live
    agent: qa-engineer
    prompt: Run the project's build and test suite. Execute all available build commands and test runners for the repository. The step passes only if build succeeds AND all tests pass. Report any failures with full error output. Do not approve if there are compilation errors, test failures, or lint errors that indicate broken code. After tests pass, if the project is a web application or service, start its development/preview server so stakeholders can access the running changes before human review. Do NOT assume a hardcoded or pre-configured port — the port is not known ahead of time and can differ per execution. Instead, discover how to run the app by inspecting the project itself (package.json scripts, Dockerfile, Makefile, README, framework defaults, etc.), start the server, and then observe the actual port it binds to from the process stdout/logs. Once the server is up and verified (e.g. with curl), register it by calling the `start_preview(port=PORT)` tool with the exact port the server actually bound to, so the preview sandbox attaches to the running process.

  - id: human-review
    type: check
    label: Human Review
    role: review
    kind: gate
    gate_kind: human-review
    branches:
      - approved
      - request-changes
      - declined

  - id: merge
    type: merge
    label: Merge
    role: merge
    kind: action

  - id: scribe
    type: scribe
    label: Scribe
    role: scribe
    kind: agent

  - id: terminal-declined
    type: terminal
    label: Declined
    role: plumbing
    kind: terminal

  - id: done
    type: terminal
    label: Done
    role: plumbing
    kind: terminal

edges:
  - from: triage
    to: fix

  - from: fix
    to: verify

  # QA verification verdict routing.
  - from: verify
    to: build-test
    when: approved

  - from: verify
    to: fix
    when: request-changes

  - from: verify
    to: terminal-declined
    when: declined

  # Build & test gate: pass advances to human review; failures loop back to fix.
  - from: build-test
    to: human-review
    when: approved

  - from: build-test
    to: fix
    when: request-changes

  - from: build-test
    to: terminal-declined
    when: declined

  # Human review gate routing.
  - from: human-review
    to: merge
    when: approved

  - from: human-review
    to: fix
    when: request-changes

  - from: human-review
    to: terminal-declined
    when: declined

  # Merge outcomes.
  - from: merge
    to: scribe
    when: merged

  - from: merge
    to: human-review
    when: blocked

  - from: scribe
    to: done
