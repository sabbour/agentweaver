# Product Management Discovery Workflow (Feature 015 US3)
# PM discovery pipeline: parallel customer/technical research → synthesis → stakeholder review.
# No merge stage — outputs are documents (specs, requirements, prototypes), not code.

id: pm-discovery
name: Product Management Discovery
description: Product discovery pipeline for user research, synthesis, and stakeholder review. Use for product discovery, requirements gathering, and feature definition. Outputs are documents and specs, not deployable code.
version: "1.0"

start: discovery-fan-out

nodes:
  - id: discovery-fan-out
    type: fan_out
    label: Parallel Discovery Research
    role: assembly
    kind: fan-out

  - id: customer-signal-research
    type: prompt
    label: Customer Signal Research
    role: customer-researcher
    kind: live
    prompt: Research and summarize customer signals, pain points, user evidence, and market evidence. Write only customer-signals.md.
    independent: true
    declared_output_paths:
      - customer-signals.md

  - id: technical-feasibility-research
    type: prompt
    label: Technical Feasibility Research
    role: prototype-designer
    kind: live
    prompt: Assess technical feasibility, constraints, risks, and implementation dependencies. Write only technical-feasibility.md.
    independent: true
    declared_output_paths:
      - technical-feasibility.md

  - id: discovery-fan-in
    type: fan_in
    label: Discovery Research Join
    role: assembly
    kind: fan-in
    target: discovery-fan-out

  - id: synthesis
    type: prompt
    label: Synthesis
    role: lead-pm
    kind: live
    prompt: Synthesize the ordered customer-signal and technical-feasibility research into the discovery recommendation.

  - id: review
    type: prompt
    label: Stakeholder Review
    role: product-marketing-manager
    kind: live
    prompt: Review the discovery synthesis from a stakeholder perspective and prepare it for approval.

  - id: review-gate
    type: check
    label: Review Gate
    role: review
    kind: gate
    gate_kind: human-review
    branches:
      - approved
      - request-changes
      - declined

  - id: terminal-declined
    type: terminal
    label: Declined
    role: plumbing
    kind: terminal

  - id: done
    type: terminal
    label: Done
    role: plumbing
    kind: terminal

edges:
  - from: discovery-fan-out
    to: customer-signal-research

  - from: discovery-fan-out
    to: technical-feasibility-research

  - from: customer-signal-research
    to: discovery-fan-in

  - from: technical-feasibility-research
    to: discovery-fan-in

  - from: discovery-fan-in
    to: synthesis

  - from: synthesis
    to: review

  # Stakeholder review flows unconditionally to human review gate.
  - from: review
    to: review-gate

  # Human review gate routing (platform merge + scribe are appended by the coordinator).
  - from: review-gate
    to: done
    when: approved

  - from: review-gate
    to: synthesis
    when: request-changes

  - from: review-gate
    to: terminal-declined
    when: declined
