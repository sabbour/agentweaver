# HTTPRoute — routes /api/*, /auth/*, /openapi/*, and OAuth 2.1 AS paths to the Agentweaver API service.
#
# All requests with path prefix /api, /auth, or /openapi are forwarded to
# agentweaver-api:8080.
# OAuth 2.1 Authorization Server discovery, JWKS, and protocol endpoints are also routed here.
#
# Request path:
#   Client -> Gateway (agentweaver-gateway) :443, TLS terminated
#       -> HTTPRoute (this)
#       -> agentweaver-api Service :8080
#       -> API pod :8080
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentweaver-api-route
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
spec:
  parentRefs:
    - name: agentweaver-gateway
  hostnames:
    - agentweaver.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: PathPrefix
            value: /openapi
        # OpenIddict serves the root RFC 8414 and OIDC discovery documents.
        - path:
            type: Exact
            value: /.well-known/oauth-authorization-server
        - path:
            type: Exact
            value: /.well-known/openid-configuration
        # Route only the configured OpenIddict and constrained registration endpoints.
        - path:
            type: Exact
            value: /oauth/authorize
        - path:
            type: Exact
            value: /oauth/token
        - path:
            type: Exact
            value: /oauth/register
        - path:
            type: Exact
            value: /oauth/revoke
        - path:
            type: Exact
            value: /oauth/jwks
      backendRefs:
        - name: agentweaver-api
          port: 8080
