# SandboxTemplate — agentweaver-agent-host (spec-018 P1.5, pod-per-run).
#
# This is the template reached through KubernetesSandboxOptions.AgentHostWarmPoolRef
# (default "agentweaver-agent-host"). KubernetesSandboxExecutor.LaunchAgentHostPodAsync
# creates a SandboxClaim with warmPoolRef=agentweaver-agent-host; the pod runs
# Agentweaver.AgentHost which hosts the A2ATurnBridgeAgent over A2A and the
# worker/api connects via RemoteAgentProxy.
#
# This supersedes the removed legacy sleep-infinity agentweaver-sandbox template/image.
#   - image: agentweaver-agent-host (the real AgentHost), NOT the old sleep-infinity image.
#   - envVarsInjectionPolicy: Allowed — the executor injects AgentHost__RunId etc.
#   - PoC: RequireMtls=false comes from the mounted configmap-agenthost (plain http :8088).
#   - PoC: readOnlyRootFilesystem relaxed to false (CopilotClient / git write to $HOME).
#     PRODUCTION must restore readOnlyRootFilesystem: true + a writable $HOME emptyDir.
#   - GitHub token (issue #471, brokered per-run): the pod runs as the dedicated
#     agentweaver-agent-host ServiceAccount, which is federated to agentweaver-agenthost-identity — a
#     SEPARATE managed identity with NO Key Vault role assignments. At run-launch the API resolves the
#     run owner's GitHub token on the API side (which legitimately holds KV access) and delivers it
#     in-memory via the POST /configure body (AgentHostRuntimeState.GitHubAccessToken). The sandbox
#     never reads Key Vault directly, so abusing shell/tool execution inside the pod cannot enumerate
#     other users' secrets. NO CSI volume, NO per-run SecretProviderClass, NO shared RWX token store.
#     HOME points at a writable emptyDir (/home/appuser) for CopilotClient/git.
#
# Pod labels `app: agentweaver-agent-host` and `agentweaver.dev/sandbox: "true"` identify
# this workload narrowly. The sandbox NetworkPolicy selectors use the same app label
# (ingress 8088 from worker+api, DNS egress, Cilium FQDN
# egress allowlist). The extra component label distinguishes agent-host pods for observability.
# The same NetworkPolicy that restricts ingress to worker+api is what guards the
# unauthenticated /configure endpoint.
#
# Apply (Kustomize):
#   kubectl apply -k k8s/overlays/production
#   (image tag + AGENTHOST_KEYVAULT_URI are injected by the overlay's `images:`
#   transformer and generated agentweaver-runtime-config ConfigMap, respectively.)
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: agentweaver-agent-host
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
    app.kubernetes.io/component: agent-host
spec:
  # No env vars are injected via SandboxClaim spec.env — the v0.5.0 controller bypasses warm
  # pool adoption whenever spec.env is present. #487 bumped the controller to v0.5.3; per the
  # blocker re-assessment on #481, none of the v0.5.1/v0.5.2/v0.5.3 release notes explicitly
  # document a fix for this adoption-bypass behavior (v0.5.3's "Efficient Warm Pool Adoption"
  # work is a performance/single-reconcile-pass change, not a documented behavior fix for this
  # specific bypass), so this workaround is kept until it is empirically re-verified against
  # v0.5.3 in a non-prod cluster. All static config lives here in the template or in the
  # agenthost-config ConfigMap mount. Per-run context (RunId / UserId / TurnBearerToken /
  # KV secret name) is delivered AFTER bind via POST /configure.
  envVarsInjectionPolicy: Allowed
  podTemplate:
    metadata:
      annotations:
        # Keep the AAD workload-identity token (env + projected volume) out of the container that
        # runs model-controlled code. Combined with the exec-no-serviceaccount mount below, the
        # executor sidecar holds no cluster or cloud identity at all.
        azure.workload.identity/skip-containers: "agentweaver-exec"
      labels:
        app: agentweaver-agent-host
        agentweaver.dev/sandbox: "true"
        app.kubernetes.io/part-of: agentweaver
        app.kubernetes.io/component: agent-host
        # Workload identity webhook mutates the pod (projected SA token + AZURE_* env)
        # so the CSI secrets-store driver can authenticate to Key Vault.
        azure.workload.identity/use: "true"
    spec:
      dnsPolicy: ClusterFirst
      runtimeClassName: kata-vm-isolation
      # Dedicated kata scheduling (fix/kata-userpool): prefer the fixed kata USER pool
      # (katapool, labeled agentweaver.io/kata=true, tainted sandbox=kata:NoSchedule) so
      # sandbox/agent-host pods stop depending on the System pool (nodepool1). The toleration
      # admits katapool's taint; the nodeAffinity is PREFERRED (not required) so pods fall
      # back to any other kata-capable node (e.g. nodepool1's kata nodes) if katapool is
      # full/unavailable — pods are never stranded.
      tolerations:
        - key: sandbox
          operator: Equal
          value: kata
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: agentweaver.io/kata
                    operator: In
                    values:
                      - "true"
      restartPolicy: Never
      serviceAccountName: agentweaver-agent-host
      automountServiceAccountToken: true  # needed for CSI workload identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentweaver-agent-host
          image: agentweaverregistry.azurecr.io/agentweaver-agent-host:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            # PoC: relaxed so CopilotClient/git can write to $HOME. PRODUCTION: set true and
            # add a writable emptyDir at /home/appuser (and keep /tmp writable).
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # spec-018: A2A listener port (AgentHost:Port). PoC plain-http; prod mTLS.
          ports:
            - name: a2a
              containerPort: 8088
              protocol: TCP
          env:
            # ASP.NET reads config from env + the mounted appsettings.k8s.json (added AFTER
            # env in Program.cs, so the configmap wins for shared keys). Per-run context
            # (RunId/UserId/TurnBearerToken) is delivered via POST /configure; the rest come
            # from the configmap.
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # Writable HOME on an emptyDir so CopilotClient/git can write (no shared RWX store).
            - name: HOME
              value: "/home/appuser"
            # issue #471: the run owner's GitHub token is delivered in-memory via the API's POST
            # /configure call (AgentHostRuntimeState.GitHubAccessToken); the sandbox does NOT read Key
            # Vault directly and its identity holds no KV roles. AgentHost__KeyVaultUri is retained
            # only as a defense-in-depth fallback target — with the dedicated KV-less identity any
            # such call fails closed — and is injected by the production overlay's configMapGenerator
            # (agentweaver-runtime-config) at deploy time.
            # Static workspace paths — always /workspace for this deployment.
            # These live here (not in the SandboxClaim) so warm pool adoption is not bypassed.
            - name: AgentHost__WorkingDirectory
              value: "/workspace"
            - name: AgentHost__RepositoryPath
              value: "/workspace"
            # Kata isolates pods from the node. Inside the pod, every model-controlled process runs
            # in the agentweaver-exec sidecar below: that container is a real PID namespace with a
            # runtime-provided procfs, and bubblewrap adds the per-run mount scoping that hides the
            # shared /workspace PVC root and sibling runs (#476). AgentHost itself never executes
            # model-controlled commands, and refuses to start if the sidecar is unavailable.
            - name: AgentHost__SandboxMode
              value: "kata"
            # Pod-private executor IPC endpoint (Unix domain socket on the exec-ipc emptyDir). The
            # socket dir is mounted ONLY into these two containers and is never bound into a
            # sandboxed child's mount namespace.
            - name: AGENTWEAVER_EXEC_SOCKET
              value: "/var/run/agentweaver-exec/exec.sock"
            # In-cluster AgentweaverMCP /mcp URL, required unconditionally at pod startup
            # (Program.cs throws InvalidOperationException from DI if empty) -- the operator
            # assistant purpose (#346/#347) is wired eagerly, not lazily per-run, so every
            # AgentHost pod (including warm-pool pods never adopted for that purpose) needs
            # this set. A constant cluster-internal Service DNS name/port, so it is safe to
            # hardcode here rather than route through the runtime-config ConfigMap.
            - name: AgentHost__McpEndpoint
              value: "http://agentweaver-mcp:8080/mcp"
            - name: AgentHost__KeyVaultUri
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: AGENTHOST_KEYVAULT_URI
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: agentweaver-secrets
                  key: appinsights-connection-string
                  optional: true
          # Capacity right-sizing (fix: agent-host resource-pressure eviction churn under concurrent
          # wave load). The katapool nodes are small kata hosts (4 vCPU / 16Gi, ~3860m/~11.7Gi
          # allocatable, plus per-pod Kata-VM overhead). The previous requests (500m / 1Gi) let the
          # scheduler pack ~7-11 agent-host pods onto a single node while each pod's limit allows a
          # 2000m / 4Gi build burst (npm install/build/test). Under a complex-app wave-1 (several
          # concurrent build subtasks) the node's REAL memory (16Gi) was blown well before the
          # request-based "allocatable" was exhausted -> kubelet MemoryPressure evictions + OOM-kills
          # + FailedScheduling (Insufficient cpu/memory). Those mid-turn pod teardowns close the A2A
          # watch stream before AgentHost flushes its terminal WorkflowOutputEvent, so a genuinely
          # successful subtask surfaces as `watch_stream_completed_without_terminal_event` (the
          # false-stall family). Raising REQUESTS to reflect a build's true working set makes the
          # scheduler honest: CPU (1000m) becomes the binding constraint at ~3 pods/node, which also
          # caps concurrent memory burst to ~3x4Gi=12Gi (<= 16Gi real), and forces the
          # cluster-autoscaler (katapool minSize 1 / maxSize 5) to add kata nodes under load instead
          # of overpacking one node into eviction. Limits are unchanged so a single heavy build can
          # still burst. The terminal-event emission-robustness half (flush-before-teardown / durable
          # terminal publication) is tracked separately as defense-in-depth under #242.
          resources:
            requests:
              memory: "1Gi"
              cpu: "400m"
              # Reserve real build headroom (checkout + node_modules/.next + package caches).
              ephemeral-storage: "1Gi"
            limits:
              memory: "2Gi"
              cpu: "1000m"
              ephemeral-storage: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            # Disk-backed scratch for pod-local execution + preview. Keep this off tmpfs: Node/Next
            # already needs the container's 4Gi memory budget.
            - name: execution-scratch
              mountPath: /local-workspace
            - name: tmp
              mountPath: /tmp
            # Writable HOME (CopilotClient / git config + caches).
            - name: home
              mountPath: /home/appuser
            # Pod-private executor IPC (UDS + token). Mounted in exactly two containers.
            - name: exec-ipc
              mountPath: /var/run/agentweaver-exec
            # Optional in PoC (RequireMtls=false): server TLS cert. Required in production.
            - name: a2a-tls
              mountPath: /mnt/a2a-tls
              readOnly: true
            # AgentHost Kestrel/security config — RequireMtls=false (PoC) lives here.
            - name: agenthost-config
              mountPath: /app/config
              readOnly: true

        # ── Executor sidecar ──────────────────────────────────────────────────────────────
        # Runs EVERY model-controlled process (shell tool calls, preview servers). Same image as
        # AgentHost so the toolchain is byte-identical and only one image is built/scanned/tagged;
        # `--exec-agent` starts the UDS daemon instead of the web host.
        #
        # WHY A SECOND CONTAINER (not just bubblewrap inside AgentHost): the Linux kernel refuses
        # `mount -t proc` inside an unprivileged user namespace when the visible procfs has
        # masked/covered submounts (`mount_too_revealing()`), and every Kubernetes runtime — Kata's
        # guest agent included — masks /proc/kcore,/proc/keys,/proc/timer_list,/proc/interrupts and
        # read-only-binds /proc/bus,fs,irq,sys,sysrq-trigger. So `bwrap --unshare-pid --proc /proc`
        # can NEVER succeed in-cluster (observed: "bwrap: Can't mount proc on /newroot/proc:
        # Operation not permitted"). The only ways to make it succeed are prohibited weakenings
        # (procMount: Unmasked, CAP_SYS_ADMIN, privileged, or a synthetic /proc). A second container
        # gets a real, runtime-created PID namespace with a matching runtime-provided procfs for
        # free — no capability, no privilege, no host namespace — and keeps bubblewrap for the
        # per-run mount scoping it CAN still do.
        #
        # Invariants an independent reviewer should check:
        #   * pod does NOT set shareProcessNamespace (that would merge the two PID namespaces and
        #     the sidecar's fail-closed probe rejects it at startup);
        #   * non-root, allowPrivilegeEscalation: false, all capabilities dropped, RuntimeDefault
        #     seccomp — identical to AgentHost, nothing added;
        #   * no hostPath, no host namespaces, no privileged mode;
        #   * the Kubernetes + workload-identity tokens are masked out of this container, so a
        #     model-controlled process cannot present the pod identity to the API server or AAD.
        - name: agentweaver-exec
          image: agentweaverregistry.azurecr.io/agentweaver-agent-host:latest
          imagePullPolicy: IfNotPresent
          args: ["--exec-agent"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            # Same relaxation as AgentHost: sandboxed toolchains (npm, pip, git) write to $HOME and
            # /tmp. Both are emptyDirs; /usr and the app root are bound read-only into every
            # bubblewrap child regardless.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: AGENTWEAVER_EXEC_SOCKET
              value: "/var/run/agentweaver-exec/exec.sock"
            - name: HOME
              value: "/home/appuser"
            # Image builds are delegated to the BuildKit broker (k8s/optional/buildkit-broker.yaml).
            # When the broker is not deployed, the client certificate Secret is absent, the endpoint
            # resolves to nothing, and the capability contract keeps reporting image_build as
            # RequiresExternalService — the sandbox never silently degrades into a build failure.
            - name: AGENTWEAVER_IMAGE_BUILD_ENDPOINT
              value: "tcp://agentweaver-buildkit.agentweaver-build.svc.cluster.local:1234"
            - name: AGENTWEAVER_IMAGE_BUILD_TLS_DIR
              value: "/mnt/buildkit-client-tls"
          # The model-controlled build/test/preview working set lives here now. Pod-level totals are
          # deliberately UNCHANGED versus the single-container layout (requests 1000m/2Gi, limits
          # 2000m/4Gi) so katapool scheduling density and burst ceiling stay exactly as documented
          # above; the budget is split rather than added.
          resources:
            requests:
              memory: "1Gi"
              cpu: "600m"
              ephemeral-storage: "1Gi"
            limits:
              memory: "2Gi"
              cpu: "1000m"
              ephemeral-storage: "4Gi"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: execution-scratch
              mountPath: /local-workspace
            - name: exec-ipc
              mountPath: /var/run/agentweaver-exec
            - name: exec-tmp
              mountPath: /tmp
            - name: exec-home
              mountPath: /home/appuser
            # Mask the projected ServiceAccount token in the container that runs model-controlled
            # code. The ServiceAccount admission plugin skips injecting its own mount when the
            # container already declares one at this path, so this empty overlay wins.
            - name: exec-no-serviceaccount
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            # Client certificate authorising build submission to the BuildKit broker. Optional, so
            # a cluster without the broker starts unchanged. It is reachable by sandboxed code by
            # design — it buys a build and nothing else, since the broker has no registry
            # credentials, no cluster token and no workspace access.
            - name: buildkit-client-tls
              mountPath: /mnt/buildkit-client-tls
              readOnly: true
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agentweaver-workspace
        - name: execution-scratch
          emptyDir:
            # Initial measured budget for a checkout, node_modules/.next, and package caches.
            # Revisit from scratch-usage telemetry before increasing.
            sizeLimit: "8Gi"
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        # Executor sidecar volumes. exec-ipc carries only the UDS + token (never bound into a
        # sandboxed child's mount namespace); exec-tmp/exec-home are the sidecar's own writable
        # scratch and HOME, deliberately NOT shared with AgentHost so model-controlled code cannot
        # read or tamper with AgentHost's git credentials/caches.
        - name: exec-ipc
          emptyDir:
            sizeLimit: "1Mi"
        - name: exec-tmp
          emptyDir:
            sizeLimit: "2Gi"
        - name: exec-home
          emptyDir:
            sizeLimit: "4Gi"
        - name: exec-no-serviceaccount
          emptyDir:
            sizeLimit: "1Mi"
        - name: buildkit-client-tls
          secret:
            secretName: agentweaver-buildkit-client-tls
            defaultMode: 0444
            optional: true
        - name: a2a-tls
          secret:
            secretName: agentweaver-a2a-server-tls
            defaultMode: 0400
            optional: true
        - name: agenthost-config
          configMap:
            name: agenthost-config
