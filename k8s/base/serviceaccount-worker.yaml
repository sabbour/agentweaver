# ServiceAccount — worker sandbox dispatcher.
#
# The worker needs a Kubernetes API token to create SandboxClaims and execute
# legacy generic sandbox commands, but must not inherit the API's preview-route
# and pod-label mutation permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentweaver-worker
  namespace: agentweaver
  annotations:
    # Replaced by the production overlay with the workload-identity values.
    azure.workload.identity/client-id: "changeme"
    azure.workload.identity/tenant-id: "changeme"
  labels:
    app.kubernetes.io/part-of: agentweaver
    app.kubernetes.io/component: worker
