apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentweaver-mcp
  namespace: agentweaver
  labels:
    app: agentweaver-mcp
    app.kubernetes.io/part-of: agentweaver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentweaver-mcp
  template:
    metadata:
      labels:
        app: agentweaver-mcp
        app.kubernetes.io/part-of: agentweaver
        azure.workload.identity/use: "true"
      annotations:
        secrets-store.csi.k8s.io/rotation-poll-interval: "2m"
    spec:
      # Dedicated least-privilege identity (serviceaccount-mcp.yaml). The public-facing MCP
      # must NOT reuse agentweaver-api's pod-create/exec/sandbox RBAC. See that file's header.
      serviceAccountName: agentweaver-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mcp
          image: agentweaverregistry.azurecr.io/agentweaver-mcp:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              exec dotnet Agentweaver.Mcp.dll
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: AGENTWEAVER_API_URL
              value: http://agentweaver-api:8080
            # Backward-compat: allow raw GitHub tokens while clients migrate.
            # Flip to "false" once all MCP clients use Agentweaver-minted tokens.
            - name: Auth__Mcp__AllowGitHubPassthrough
              value: "true"
            # The browser Assistant forwards its current platform session token through the
            # AgentHost. In Entra mode MCP validates that token before forwarding it to the API,
            # which independently validates it again and applies platform/project authorization.
            - name: Auth__Mode
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: AUTH_MODE
            - name: Auth__Entra__ClientId
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: ENTRA_CLIENT_ID
            - name: Auth__Entra__TenantId
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: ENTRA_TENANT_ID
          volumeMounts: []
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes: []
