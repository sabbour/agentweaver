apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentweaver-agent-host
  namespace: agentweaver
  annotations:
    # Populated by 15-setup-identity.mjs; injected by the production overlay's
    # replacements from the agentweaver-runtime-config ConfigMap at deploy time.
    # DEDICATED least-privilege identity (issue #471): this is agentweaver-agenthost-identity,
    # a SEPARATE managed identity from agentweaver-api with NO Key Vault role assignments. The
    # sandbox runs untrusted shell/tool code, so it must never be able to exchange its
    # workload-identity token for a Key Vault access token and read other users' secrets. The run
    # owner's GitHub token is brokered per-run via the API's POST /configure call
    # (KubernetesSandboxExecutor.ResolveGitHubAccessTokenAsync -> AgentHostRuntimeState.GitHubAccessToken),
    # NOT a direct vault fetch. The overlay wires this SA's client-id from AGENTHOST_IDENTITY_CLIENT_ID.
    azure.workload.identity/client-id: "changeme"
    # Injects AZURE_TENANT_ID into the pod via the workload-identity webhook. Retained for the
    # workload-identity projection; note the associated identity holds no Key Vault roles, so any
    # residual direct vault call fails closed.
    azure.workload.identity/tenant-id: "changeme"
  labels:
    app.kubernetes.io/part-of: agentweaver
