apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentweaver-api
  namespace: agentweaver
  labels:
    app: agentweaver-api
    app.kubernetes.io/part-of: agentweaver
spec:
  # spec-018 P2 cutover: Postgres primary. RWX workspace (/workspace/.home) replaces RWO data PVC.
  # Recreate → RollingUpdate now that SQLite single-writer constraint is lifted.
  # replicas:2 — both pods land on different nodes; RWX Azure Files allows multi-node mount.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: agentweaver-api
  template:
    metadata:
      labels:
        app: agentweaver-api
        app.kubernetes.io/part-of: agentweaver
        # Required by the Azure Workload Identity webhook to inject the OIDC token volume.
        azure.workload.identity/use: "true"
      annotations:
        secrets-store.csi.k8s.io/rotation-poll-interval: "2m"
    spec:
      # Assistant-chat-termination fix: operator assistant turns can legitimately run
      # 60-100+s across multiple MCP tool calls. The default 30s terminationGracePeriodSeconds
      # was cutting these off mid-turn (OperationCanceledException from RequestAborted) on every
      # rolling deploy — this repo ships multiple releases/day. 120s pairs with Program.cs's
      # ShutdownTimeout=100s, leaving ~20s margin for actual process exit after graceful drain.
      terminationGracePeriodSeconds: 120
      serviceAccountName: agentweaver-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: migrate-memory-db
          image: agentweaverregistry.azurecr.io/agentweaver-api:latest
          imagePullPolicy: Always
          command:
            - /app/efbundle
            - --verbose
            - --
            - --postgres-migrations
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # spec-018 P2: HOME on /tmp; no agentweaver-data PVC in Postgres mode.
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
              value: /tmp/.net
            # spec-018 P2: run efbundle against Postgres.
            - name: Database__Provider
              value: "Postgres"
            - name: ConnectionStrings__MemoryDb
              valueFrom:
                secretKeyRef:
                  name: agentweaver-postgres
                  key: connectionstring
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: agentweaver-postgres
                  key: connectionstring
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: api
          image: agentweaverregistry.azurecr.io/agentweaver-api:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export Auth__ApiKey="$(cat /mnt/secrets-store/mcp-api-key)"
              exec dotnet Agentweaver.Api.dll
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            # Per-pod identity for ResilientCheckpointStore: when the shared checkpoint store on the
            # RWX HOME volume is already locked by another replica, the loser falls back to a per-pod
            # checkpoint sub-dir ({checkpoints}/replicas/{POD_NAME}) so it still boots. The downward
            # API gives a stable, unique name; HOSTNAME (== pod name) is the fallback if unset.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # spec-018 P2: HOME on RWX workspace/.home — shared across all replicas + worker.
            # AppPaths.DataDirectory → $HOME/.local/share/agentweaver (token store, checkpoints, worktrees).
            # /workspace is RWX (Azure Files); agentweaver-data RWO PVC is dropped.
            - name: HOME
              value: /workspace/.home
            # SQLite path kept for reference; unused when Database__Provider=Postgres.
            - name: Database__Path
              value: /tmp/agentweaver.db
            - name: Workspace__Path
              value: /workspace
            # In-process loopback base URL for agent decision/memory/inbox tools and Scribe.
            # The API binds 8080 (ASPNETCORE_URLS); without this they default to the dead :5000
            # port → connection refused → "Tool execution failed". Explicit override of the
            # code-level binding-derivation fallback.
            - name: Agentweaver__ApiBaseUrl
              value: http://localhost:8080
            # Serialized only to pod-per-run AgentHost turns. Unlike the in-process URL above,
            # this must be reachable from the sandbox namespace.
            - name: Agentweaver__RemoteApiBaseUrl
              value: http://agentweaver-api.agentweaver.svc.cluster.local:8080
            - name: Workspace__Provider
              value: persistent-volume
            - name: Workspace__PersistentVolume__MountRoot
              value: /workspace
            - name: Sandbox__Backend
              value: kubernetes
            - name: Sandbox__Kubernetes__Namespace
              value: agentweaver
            # spec-018 P1.5 live flip: execute agent turns inside a per-run AgentHost
            # sandbox pod over the A2A bridge (default in-api). RequireMtls=false is the
            # PoC plain-http path; the pod reads the shared RWX token store (UseSharedTokenStore).
            - name: Sandbox__AgentExecutionMode
              value: pod-per-run
            # Run implementation subtasks from verified pod-local checkouts. This prevents
            # package-manager writes and native postinstall chmod operations from hitting Azure Files SMB.
            - name: Sandbox__PodLocalWorkspace__ImplementationEnabled
              value: "true"
            - name: Sandbox__AgentHost__RequireMtls
              value: "false"
            # Microsoft Entra ID browser sign-in (#653/#658). Only meaningful when Auth__Mode=Entra;
            # Auth__Entra__ClientSecret is deliberately OMITTED here -- #658
            # made it optional so PKCE-only authorization-code redemption works when a tenant policy
            # blocks client secrets; set it manually via the Key Vault CSI/SecretProviderClass only
            # if/when a future tenant allows a confidential-client secret.
            - name: Auth__Mode
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: AUTH_MODE
            - name: Auth__Entra__ClientId
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: ENTRA_CLIENT_ID
            - name: Auth__Entra__TenantId
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: ENTRA_TENANT_ID
            - name: Auth__Entra__EnterpriseAppObjectId
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: ENTRA_ENTERPRISE_APP_OBJECT_ID
            - name: Auth__Entra__RedirectUri
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: ENTRA_REDIRECT_URI
            - name: Auth__Entra__FrontendUrl
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: ENTRA_FRONTEND_URL
            - name: Auth__OAuth__PublicOrigin
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: OAUTH_PUBLIC_ORIGIN
            - name: Auth__OAuth__ForwardedHeaders__TrustedNetworks
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: OAUTH_TRUSTED_PROXY_NETWORKS
            - name: Auth__OAuth__Certificates__SigningName
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: OAUTH_SIGNING_CERTIFICATE_NAME
            - name: Auth__OAuth__Certificates__EncryptionName
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: OAUTH_ENCRYPTION_CERTIFICATE_NAME
            # GitHub Copilot App OAuth credentials. Its private key must remain unset:
            # this App uses the OAuth flow and is intentionally distinct from the Repo App.
            - name: Auth__CopilotApp__ClientId
              valueFrom:
                secretKeyRef:
                  name: agentweaver-secrets
                  key: copilot-app-client-id
            - name: Auth__CopilotApp__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: agentweaver-secrets
                  key: copilot-app-client-secret
            - name: Auth__CopilotApp__CallbackUrl
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: COPILOT_APP_CALLBACK_URL
            # Shared GitHub Copilot OAuth callback for both project-scoped and
            # platform-default flows; the server dispatches by persisted state.
            - name: Auth__CopilotApp__Slug
              value: agentweaver-orchestrator-copilot
            # Browser redirect target after the OAuth callback completes. Without this,
            # ProjectCopilotBindingService.GetCallbackRedirectAsync falls back to its
            # http://localhost:5173 development default, sending production users to
            # their own machine instead of back to the deployed frontend.
            - name: Auth__CopilotApp__FrontendUrl
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: ENTRA_FRONTEND_URL
            # The Repo App holds repository access and fetches its PEM at runtime
            # from Key Vault using this secret name rather than mounting the PEM.
            - name: Auth__RepoApp__ClientId
              valueFrom:
                secretKeyRef:
                  name: agentweaver-secrets
                  key: repo-app-client-id
            - name: Auth__RepoApp__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: agentweaver-secrets
                  key: repo-app-client-secret
            - name: Auth__RepoApp__CallbackUrl
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: REPO_APP_CALLBACK_URL
            # Browser redirect target after the OAuth callback completes; same rationale
            # as Auth__CopilotApp__FrontendUrl above (RepoAppUserAuthorizationService has
            # the identical http://localhost:5173 fallback).
            - name: Auth__RepoApp__FrontendUrl
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: ENTRA_FRONTEND_URL
            - name: Auth__RepoApp__AppId
              valueFrom:
                secretKeyRef:
                  name: agentweaver-secrets
                  key: repo-app-id
            - name: Auth__RepoApp__PrivateKeySecretName
              value: repo-app-private-key
            # GitHub Repo App / Copilot App connection credentials persist in Key Vault so the
            # API can read them back for on-behalf-of calls. Requires "Key Vault Secrets Officer"
            # on agentweaver-api-identity (granted by scripts/aks/15-setup-identity.sh).
            # WorkloadIdentityCredential resolves automatically from the webhook-injected
            # AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_FEDERATED_TOKEN_FILE env vars.
            - name: Auth__KeyVault__Uri
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: KEYVAULT_URI
            - name: OTEL_SERVICE_NAME
              value: agentweaver-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=agentweaver,deployment.environment=production
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: agentweaver-secrets
                  key: appinsights-connection-string
                  optional: true
            - name: APPLICATIONINSIGHTS_WORKSPACE_ID
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: APPINSIGHTS_WORKSPACE_ID
            - name: TMPDIR
              value: /tmp
            # H1 (spec-018): paths for worker mTLS client cert used by RemoteAgentProxy
            # when dialing the AgentHost A2A endpoint.  Morpheus wires these into
            # the HttpClientHandler that backs the A2AAgent / IA2AClient.
            - name: Sandbox__A2A__ClientCertPath
              value: /mnt/a2a-client-tls/tls.crt
            - name: Sandbox__A2A__ClientKeyPath
              value: /mnt/a2a-client-tls/tls.key
            - name: Sandbox__A2A__CACertPath
              value: /mnt/a2a-client-tls/ca.crt
            # H4: A2A port — must match the Kestrel endpoint in configmap-agenthost.yaml.
            - name: Sandbox__A2A__Port
              value: "8088"
            # Preview gateway wiring — values resolved at deploy time by 30-deploy.sh.
            # ZoneSuffix is either "preview.<zone>" (nested wildcard cert) or "<zone>" (fallback).
            # GatewayName/GatewayNamespace are static; only Enabled+ZoneSuffix are templated.
            - name: Sandbox__Preview__Enabled
              value: "true"
            - name: Sandbox__Preview__ZoneSuffix
              valueFrom:
                configMapKeyRef:
                  name: agentweaver-runtime-config
                  key: SANDBOX_PREVIEW_ZONE_SUFFIX
            - name: Sandbox__Preview__GatewayName
              value: "agentweaver-preview-gateway"
            - name: Sandbox__Preview__GatewayNamespace
              value: "agentweaver"
            # spec-018 P2: Postgres primary — flip from sqlite.
            - name: Database__Provider
              value: "Postgres"
            - name: ConnectionStrings__MemoryDb
              valueFrom:
                secretKeyRef:
                  name: agentweaver-postgres
                  key: connectionstring
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: agentweaver-postgres
                  key: connectionstring
          volumeMounts:
            # spec-018 P2: agentweaver-data RWO PVC dropped. /workspace RWX is primary.
            # HOME=/workspace/.home gives token store + worktrees on shared RWX volume.
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
            # H1 (spec-018): worker mTLS client cert + CA cert for A2A transport.
            # RemoteAgentProxy must load tls.crt / tls.key as the client certificate
            # and ca.crt as the trust anchor when dialing the AgentHost A2A endpoint.
            - name: a2a-client-tls
              mountPath: /mnt/a2a-client-tls
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /api/ping
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          # Assistant-chat-termination fix: delay SIGTERM to the process by 5s so the
          # Service/Endpoints controller has time to deregister this pod from load balancing
          # BEFORE it starts refusing new connections. Prevents new requests being routed to
          # a pod that's already shutting down, while in-flight requests (e.g. long operator
          # assistant turns) keep draining for the rest of terminationGracePeriodSeconds.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      # spec-018 P2: agentweaver-data volume removed; Postgres is primary data store.
      # The PVC is retained (not deleted) as a safety net for emergency SQLite rollback.
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: agentweaver-workspace
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: agentweaver-secrets
        # H1 (spec-018): worker mTLS client cert for A2A transport (spec-018).
        # Secret created by scripts/aks/gen-a2a-mtls-certs.sh.
        - name: a2a-client-tls
          secret:
            secretName: agentweaver-a2a-client-tls
            defaultMode: 0400
