# worker-hpa.yaml — Autoscaling for the agentweaver-worker Deployment.
#
# CURRENT: CPU-based HPA (min 2 / max 3, target 70% CPU utilization).
# This is the fallback per platform-deployment.md §2.3: "if KEDA is unavailable,
# fall back to an HPA on a custom 'queued runs' metric exported via OTEL/Prometheus".
#
# issue #108 status (see decisions/inbox/niobe-108-hpa-investigation.md): the
# `agentweaver_run_queued` OTel gauge (count of ACTIVE-project Ready backlog tasks still awaiting
# coordinator pickup: `backlog_tasks.state='ready' AND run_id IS NULL`, sampled every 15s) is now
# emitted by the API and visible in the AKS Managed Prometheus workspace — see
# docs/guide/operations.md "Worker autoscaling". This HPA has NOT yet been switched to consume it:
# doing so requires either (a) KEDA with a Prometheus scaler using `max(agentweaver_run_queued)`
# (NOT sum — every replica exports the same global count), or (b) provisioning a Kubernetes
# External Metrics API adapter, neither of which is currently deployed in scripts/aks/. CPU remains
# the active scaling signal until one path is chosen.
#
# RECOMMENDED UPGRADE PATH (when KEDA is confirmed available on the cluster):
# Replace this HPA with a KEDA ScaledObject using a Prometheus scaler (preferred with the current
# exported gauge), or a direct PostgreSQL query over the same Ready backlog semantics:
#
#   apiVersion: keda.sh/v1alpha1
#   kind: ScaledObject
#   metadata:
#     name: agentweaver-worker-keda
#     namespace: agentweaver
#   spec:
#     scaleTargetRef:
#       name: agentweaver-worker
#     minReplicaCount: 1
#     maxReplicaCount: 5
#     pollingInterval: 15
#     cooldownPeriod: 60
#     triggers:
#       - type: prometheus
#         metadata:
#           targetQueryValue: "5"         # scale out when >5 ready backlog tasks per replica
#           activationTargetQueryValue: "1"
#           serverAddress: https://<managed-prometheus-endpoint>
#           metricName: agentweaver_run_queued
#           query: max(agentweaver_run_queued)
#
# If a future direct Postgres scaler is preferred instead, query the same semantic contract:
#   SELECT count(*) FROM backlog_tasks bt
#   JOIN projects p ON p.project_id = bt.project_id
#   WHERE bt.state = 'ready' AND bt.run_id IS NULL AND bt.archived_at IS NULL
#     AND p.state = 'active'
# Coordinate with Tank before enabling KEDA scaling.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentweaver-worker-hpa
  namespace: agentweaver
  labels:
    app: agentweaver-worker
    app.kubernetes.io/part-of: agentweaver
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentweaver-worker
  # min 2: preserves one worker during a voluntary disruption (worker PDB).
  # max 3: conservative ceiling for staging; raise once quota.yaml ceilings are adjusted
  #        (platform-deployment.md §3.2) and KEDA/lease-depth scaling is validated.
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Worker is I/O-bound (DB + K8s API + sandbox dispatch), not CPU-bound.
          # 70% target is conservative to trigger scale-out before queues back up.
          # Replace with queue-depth KEDA trigger once the lease schema is stable.
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120  # Don't thrash scale-down during bursty workloads.
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
---
# PDB — retain one worker while allowing one voluntary disruption at a time.
# The worker HPA floor is two replicas, so minAvailable: 1 does not block all
# node-drain or rolling-maintenance disruptions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentweaver-worker-pdb
  namespace: agentweaver
  labels:
    app: agentweaver-worker
    app.kubernetes.io/part-of: agentweaver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agentweaver-worker
---
# Web-tier scaling note (post-Postgres-cutover):
#
# Once Database__Provider=Postgres is active on the web tier (api-deployment.yaml):
#   1. Remove the agentweaver-data PVC mount + pvc-data.yaml from 30-deploy.sh.
#   2. Change api-deployment.yaml strategy: Recreate → RollingUpdate.
#   3. Set api-deployment.yaml replicas: 2 (or wire a web HPA, example below).
#   4. The web tier is then CPU/request-rate scalable with no single-writer constraint.
#
# Example web HPA (apply after cutover):
#
#   apiVersion: autoscaling/v2
#   kind: HorizontalPodAutoscaler
#   metadata:
#     name: agentweaver-web-hpa
#     namespace: agentweaver
#   spec:
#     scaleTargetRef:
#       apiVersion: apps/v1
#       kind: Deployment
#       name: agentweaver-api
#     minReplicas: 2
#     maxReplicas: 5
#     metrics:
#       - type: Resource
#         resource:
#           name: cpu
#           target:
#             type: Utilization
#             averageUtilization: 70
