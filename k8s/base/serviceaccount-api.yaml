apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentweaver-api
  namespace: agentweaver
  annotations:
    # Populated by 15-setup-identity.mjs; injected by the production overlay's
    # replacements from the agentweaver-runtime-config ConfigMap at deploy time.
    azure.workload.identity/client-id: "changeme"
    # Required so the workload-identity webhook injects AZURE_TENANT_ID into the
    # pod, enabling DefaultAzureCredential / WorkloadIdentityCredential to call
    # Key Vault directly (e.g. GitHub token store SetAsync / GetAsync).
    azure.workload.identity/tenant-id: "changeme"
