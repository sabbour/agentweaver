# ServiceAccount — agentweaver-mcp (public-facing MCP server).
#
# HARDENING (security: least-privilege identity for the web-facing MCP): the MCP
# Deployment previously ran as the shared agentweaver-api ServiceAccount, which is bound
# to the agentweaver-api-sandbox Role (rbac-api.yaml) granting pods `create`, `pods/exec
# create`, and sandboxclaims/services/httproutes/secretproviderclasses create+delete.
# The MCP is the only INTERNET-EXPOSED workload in the namespace (mcp-httproute.yaml), so
# reusing that identity meant a compromise of the public MCP could create arbitrary
# (non-Kata) pods, exec into API/worker containers, mount namespace Secrets, or select
# another ServiceAccount — namespace privilege escalation (Alert 4).
#
# The MCP does NOT use the Kubernetes API at all: it talks to the API purely over HTTP
# (AGENTWEAVER_API_URL=http://agentweaver-api:8080) and uses Azure Workload Identity only to
# reach Key Vault (token validation/minting). So it gets its own ServiceAccount with NO
# RoleBinding to agentweaver-api-sandbox (no pod create/exec, no sandbox CRUD), and the
# projected default K8s API token is disabled. The Azure Workload Identity token is injected
# separately by the webhook and is unaffected, so Key Vault access continues to work.
#
# The azure.workload.identity/{client-id,tenant-id} annotations are placeholders here and are
# rewritten at deploy time by the production overlay's `replacements` (which target every
# ServiceAccount) — see k8s/overlays/production/kustomization.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentweaver-mcp
  namespace: agentweaver
  annotations:
    azure.workload.identity/client-id: "changeme"
    azure.workload.identity/tenant-id: "changeme"
  labels:
    app.kubernetes.io/part-of: agentweaver
    app.kubernetes.io/component: mcp
# The MCP never calls the Kubernetes API, so it does not need the default projected SA token.
# Workload Identity's federated token is injected independently and is not disabled by this.
automountServiceAccountToken: false
