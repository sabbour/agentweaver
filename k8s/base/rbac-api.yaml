apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentweaver-api-sandbox
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
rules:
  # #570: patch/update are required so KeepAliveAsync/RenewBackingClaimTtlAsync (#560/#564) can
  # JSON-merge-patch spec.lifecycle.ttlSecondsAfterFinished on the backing SandboxClaim while a
  # preview is active. Without these verbs every renewal attempt 403s and the fix in #564 is a
  # silent no-op — the sandbox controller still reaps the pod on its original TTL.
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
  # Templates and warm pools are deployed manifests. The API only reads them for
  # sandbox diagnostics; it must not be able to alter the pod template.
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxtemplates
      - sandboxwarmpools
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - patch
  # Legacy generic sandbox commands still use exec. Pod creation is deliberately
  # delegated to the SandboxClaim controller, never granted to this identity.
  # Note (issue #473): Kubernetes RBAC does not support label-based resourceNames for 'create' on pods/exec.
  # This grant is restricted natively by the ValidatingAdmissionPolicy in vap-sandbox-exec.yaml,
  # which enforces that these ServiceAccounts can only exec into pods with the agentweaver-agent-host- name prefix.
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  # Dynamic per-preview Service objects — created/deleted by the API sandbox preview manager.
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - list
      - create
      - delete
  # Dynamic per-preview HTTPRoute objects — created/deleted by the API sandbox preview manager.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
  # ResourceQuota — read by DiagnosticsService.CheckAgentPodQuotaDetailedAsync for the
  # Cluster health page (agent_pod_quota check).
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentweaver-api-sandbox
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
subjects:
  - kind: ServiceAccount
    name: agentweaver-api
    namespace: agentweaver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentweaver-api-sandbox
---
# Worker sandbox-dispatch permissions. Keep this distinct from the API Role:
# the worker never CREATES browser-preview Services/HTTPRoutes (route lifecycle
# stays with the API). But the worker heartbeat runs AgentHostReaperService, whose
# orphan sweep must honor live previews before deleting a completed child's claim
# (#578). That preview check reads cluster HTTPRoute state and, on defer, renews the
# backing claim TTL (#560) and re-pins the backing pod's safe-to-evict annotation
# (#574) — so the worker needs read on httproutes and patch on sandboxclaims/pods.
# Without these the worker's HasActivePreviewAsync 403s, false-negatives, and deletes
# the live preview's backing claim (the #578 root cause).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentweaver-worker-sandbox
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
rules:
  # #578: patch/update let the reaper's defer branch renew the backing SandboxClaim
  # TTL (#560/#564) so the sandbox controller does not reap a still-previewed pod.
  - apiGroups:
      - extensions.agents.x-k8s.io
    resources:
      - sandboxclaims
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
  # #578: patch lets the reaper's defer branch re-pin the backing pod's
  # cluster-autoscaler.kubernetes.io/safe-to-evict annotation to "false" (#574) so a
  # kata-node scale-down does not evict a still-previewed pod.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - patch
  # The worker's preview orphan sweep lists preview Services before it can safely
  # delete stale sandbox claims. It remains read-only for Service resources.
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
  # #578: read-only access to per-preview HTTPRoutes so the worker's
  # AgentHostReaperService.HasActivePreviewAsync can see a live preview and defer the
  # orphan reap. The worker never creates or deletes routes — that stays with the API.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
  # Required only by the legacy generic command executor. Sandbox pod creation
  # remains exclusively with the SandboxClaim controller.
  # Note (issue #473): Kubernetes RBAC does not support label-based resourceNames for 'create' on pods/exec.
  # This grant is restricted natively by the ValidatingAdmissionPolicy in vap-sandbox-exec.yaml,
  # which enforces that these ServiceAccounts can only exec into pods with the agentweaver-agent-host- name prefix.
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentweaver-worker-sandbox
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
subjects:
  - kind: ServiceAccount
    name: agentweaver-worker
    namespace: agentweaver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentweaver-worker-sandbox
