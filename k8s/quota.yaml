apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentweaver-quota
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
spec:
  hard:
    # Kubernetes owns pod admission/scheduling/queueing and the cluster autoscaler is the real
    # concurrency ceiling (autoscaler max-nodes), so this quota no longer caps CPU/memory — capping
    # them here made the app pre-flight capacity itself and hard-fail runs while nodes sat idle
    # (issue #217). Only object counts are bounded, set well above realistic concurrency so a Pending
    # pod waits for the pool to autoscale rather than being rejected on admission.
    pods: "200"
    persistentvolumeclaims: "4"
    requests.storage: 80Gi
    count/sandboxclaims.extensions.agents.x-k8s.io: "200"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: agentweaver-default-limits
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
      max:
        cpu: "4"
        memory: 4Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentweaver-api-pdb
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agentweaver-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentweaver-mcp-pdb
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agentweaver-mcp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentweaver-frontend-pdb
  namespace: agentweaver
  labels:
    app.kubernetes.io/part-of: agentweaver
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agentweaver-frontend
