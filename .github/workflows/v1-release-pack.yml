name: Agentweaver v1 NuGet packages

on:
  push:
    branches:
      - v1
    paths:
      - releases/foundation.json

permissions:
  contents: read
  packages: write

jobs:
  publish-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: dotnet restore Agentweaver.slnx --locked-mode

      - name: Pack versioned NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/agentweaver-packages"
          mkdir -p "$output"
          while IFS= read -r project; do
            dotnet pack "$project" --configuration Release --no-restore --output "$output"
          done < <(jq -r '.components[] | select(.kind == "contract" or .kind == "library") | .project' releases/foundation.json)
          compgen -G "$output/*.nupkg" >/dev/null || {
            echo "No NuGet packages were produced." >&2
            exit 1
          }

      - name: Publish NuGet packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for package in "$RUNNER_TEMP"/agentweaver-packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json" \
              --api-key "$GITHUB_TOKEN" \
              --skip-duplicate
          done
