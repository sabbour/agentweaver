name: v1 release pack

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact full v1 commit SHA to prepare (and optionally publish)
        required: true
        type: string
      publish:
        description: Publish packages/images manually after environment approval (never deploy)
        required: true
        default: false
        type: boolean
      foundation_probe_sampler_replacement:
        description: Select only the one-time sampler-fixed Probe 0.0.0 replacement (separate user approval required)
        required: true
        default: false
        type: boolean
      expected_probe_digest:
        description: Exact approved current Probe digest, required only for sampler replacement
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the v1 branch
        if: ${{ github.ref != 'refs/heads/v1' }}
        run: |
          echo "::error::v1 release pack must be dispatched from refs/heads/v1 (got $GITHUB_REF); refusing to run off-branch." >&2
          exit 1
      - name: Require exact dispatch source
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
          PROBE_SAMPLER_REPLACEMENT: ${{ inputs.foundation_probe_sampler_replacement }}
          EXPECTED_PROBE_DIGEST: ${{ inputs.expected_probe_digest }}
        run: |
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA" || { echo "::error::Dispatch source mismatch"; exit 1; }
          if [ "$PROBE_SAMPLER_REPLACEMENT" = "true" ]; then
            test "$EXPECTED_PROBE_DIGEST" = "sha256:835d5b8899f2a8956faf24d46a934ec745d91ff83363d77f22f2859c2f743969" || { echo "::error::Probe current digest mismatch"; exit 1; }
          else
            test -z "$EXPECTED_PROBE_DIGEST" || { echo "::error::Probe digest requires sampler replacement intent"; exit 1; }
          fi
      - uses: actions/setup-dotnet@v4
        if: ${{ github.ref == 'refs/heads/v1' }}
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        if: ${{ github.ref == 'refs/heads/v1' }}
        with:
          node-version: '24'
      - name: Validate release composition
        if: ${{ github.ref == 'refs/heads/v1' }}
        run: npm run release:validate
      - name: Prepare locked package and image artifacts (no publish)
        if: ${{ github.ref == 'refs/heads/v1' }}
        env:
          PROBE_SAMPLER_REPLACEMENT: ${{ inputs.foundation_probe_sampler_replacement }}
        run: |
          args=()
          if [ "$PROBE_SAMPLER_REPLACEMENT" = "true" ]; then args+=(--foundation-probe-only); fi
          npm run release:pack -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: ${{ github.ref == 'refs/heads/v1' && !cancelled() }}
        with:
          name: v1-release-pack-${{ github.sha }}-${{ github.run_id }}
          overwrite: true
          path: artifacts/release/pack/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: pack
    if: ${{ inputs.publish && !inputs.foundation_probe_sampler_replacement }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: v1-publication
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: v1-release-pack-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/release/pack/
      - name: Manually publish verified exact-source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUGET_SOURCE: ${{ vars.RELEASE_NUGET_SOURCE }}
          RELEASE_NUGET_API_KEY: ${{ secrets.RELEASE_NUGET_API_KEY }}
          RELEASE_REGISTRY: ${{ vars.RELEASE_REGISTRY }}
          RELEASE_REGISTRY_USER: ${{ secrets.RELEASE_REGISTRY_USER }}
          RELEASE_REGISTRY_PASSWORD: ${{ secrets.RELEASE_REGISTRY_PASSWORD }}
          DOCKER_CONFIG: ${{ github.workspace }}/artifacts/docker-config
        run: node scripts/release/publish.mjs releases/foundation.json artifacts/release/pack "$GITHUB_SHA" --confirm-publication
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: v1-publication-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release/pack/publication.json
          if-no-files-found: warn
          retention-days: 30
  publish-probe-sampler:
    needs: pack
    if: ${{ inputs.publish && inputs.foundation_probe_sampler_replacement }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    environment: v1-publication
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: v1-release-pack-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/release/pack/
      - name: Publish only the separately approved sampler-fixed Probe
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REGISTRY: ghcr.io/sabbour
          RELEASE_REGISTRY_USER: ${{ github.repository_owner }}
          RELEASE_REGISTRY_PASSWORD: ${{ github.token }}
          DOCKER_CONFIG: ${{ github.workspace }}/artifacts/docker-config
          EXPECTED_PROBE_DIGEST: ${{ inputs.expected_probe_digest }}
        run: node scripts/release/publish.mjs releases/foundation.json artifacts/release/pack "$GITHUB_SHA" --confirm-publication --foundation-probe-only --confirm-foundation-probe-sampler-replacement "$GITHUB_SHA" --expected-foundation-probe-sampler-digest "$EXPECTED_PROBE_DIGEST"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: v1-publication-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/release/pack/publication.json
          if-no-files-found: warn
          retention-days: 30
