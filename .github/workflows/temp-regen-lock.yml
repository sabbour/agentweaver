name: Temp Regenerate NuGet Lock

on:
  push:
    branches:
      - dependabot/nuget/apps/Agentweaver.AgentHost/opentelemetry-bf7cedd030

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore with force-evaluate
        run: dotnet restore agentweaver.sln --force-evaluate

      - name: Commit and push lock file changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '**/packages.lock.json'
          if git diff --cached --quiet; then
            echo "No lock file changes"
          else
            git commit -m "chore: regenerate packages.lock.json for NuGet bump"
            git push
          fi
