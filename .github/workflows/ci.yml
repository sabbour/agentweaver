name: CI

# Runs the repository's real verification suites on every pull request and on
# pushes to dev and main. Each area runs in its own job so it gets a dedicated runner:
# the .NET and web test suites contain timing-sensitive tests (heartbeat /
# deadline / render-timeout budgets) that flake only under CPU contention, so
# keeping the suites off a single shared runner keeps the signal reliable.
#
# Commands mirror the ones documented in CONTRIBUTING.md exactly:
#   - dotnet test tests/Agentweaver.Tests/Agentweaver.Tests.csproj -p:CopilotSkipCliDownload=true
#   - node --test scripts/azure/tests/*.test.mjs scripts/changesets/tests/*.test.mjs
#   - npm --prefix apps/web run test
#   - npm --prefix apps/web run lint
#   - npm run docs:build
#
# A `changes` job classifies the PR/push diff by path group first, and every
# suite job below only runs `if:` its group actually changed (a change to this
# workflow file itself always trips every group). A job whose `if:` is false is
# reported to GitHub as "skipped", which required-status-checks rulesets treat
# as passing, so this stays safe for branch protection while saving CI minutes
# on diffs (e.g. docs-only PRs) that can't affect the skipped suites.
# `Changeset advisory` always runs regardless of paths, since it must evaluate
# every PR for whether a changeset was needed.

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      web: ${{ steps.filter.outputs.web }}
      node-toolchain: ${{ steps.filter.outputs.node-toolchain }}
      docs: ${{ steps.filter.outputs.docs }}
      diagrams: ${{ steps.filter.outputs.diagrams }}
    steps:
      - uses: actions/checkout@v4
      # dorny/paths-filter classifies the PR/push diff into named groups below.
      # Every group includes .github/workflows/** so a change to this pipeline
      # itself always trips every downstream job, never leaving a suite skipped
      # just because the workflow that runs it changed.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'apps/**/*.cs'
              - 'packages/**/*.cs'
              - 'tests/**'
              - '**/*.csproj'
              - '**/*.sln'
              - 'global.json'
              - 'nuget.config'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - '.github/workflows/**'
            node-toolchain:
              - 'scripts/azure/**'
              - 'scripts/changesets/**'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - '.github/workflows/**'
            diagrams:
              - 'docs/diagrams/**'
              - 'README.md'
              - 'docs/guide/architecture-aks.md'
              - 'scripts/docs/**'
              - '.github/workflows/**'

  dotnet-tests:
    name: .NET tests
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # CopilotSkipCliDownload=true keeps the GitHub.Copilot.SDK MSBuild target
      # from trying to fetch a platform copilot CLI binary during build. It is
      # required on ARM64/Windows dev machines and harmless on an x64 runner --
      # kept here for parity with the documented local command.
      - name: Run .NET tests
        run: dotnet test tests/Agentweaver.Tests/Agentweaver.Tests.csproj -p:CopilotSkipCliDownload=true

  node-toolchain-tests:
    name: Node toolchain tests
    needs: changes
    if: needs.changes.outputs.node-toolchain == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The scripts/azure toolchain uses only Node built-ins (no dependencies),
      # so there is nothing to install -- run the built-in test runner directly.
      - name: Run Node toolchain tests
        run: node --test scripts/azure/tests/*.test.mjs scripts/changesets/tests/*.test.mjs

  web-tests:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run web tests (Vitest)
        run: npm run test
        working-directory: apps/web

  web-lint:
    name: Web lint
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run web lint (ESLint)
        run: npm run lint
        working-directory: apps/web

  docs-build:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      # Builds the VitePress site (source of truth for sabbour.me/agentweaver).
      # Catches broken markdown, dead config, and landing-page regressions.
      - name: Build docs site
        run: npm run docs:build

  diagrams-in-sync:
    name: Architecture diagrams are in sync
    needs: changes
    if: needs.changes.outputs.diagrams == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # README.md's "Block diagram" and architecture-aks.md's "Component
      # diagram" are pre-rendered from docs/diagrams/specs/*.json (React Flow +
      # dagre layout) to static SVG (GitHub's live Mermaid renderer clipped
      # long subgraph/node labels on those diagrams). This check is a pure
      # SHA-256 hash comparison against docs/diagrams/manifest.json -- no
      # rendering/browser involved -- so it can't drift between OSes; it
      # fails if a source JSON was edited without regenerating its SVG.
      - name: Check rendered diagrams match source
        run: npm run docs:check-diagrams

  changeset-advisory:
    name: Changeset advisory
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || startsWith(github.base_ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run version:check
      - run: npm run changeset:check -- --base origin/${{ github.base_ref }}
