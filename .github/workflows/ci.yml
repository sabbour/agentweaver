name: CI

# Runs the repository's real verification suites on every pull request and on
# pushes to dev and main. Each area runs in its own job so it gets a dedicated runner:
# the .NET and web test suites contain timing-sensitive tests (heartbeat /
# deadline / render-timeout budgets) that flake only under CPU contention, so
# keeping the suites off a single shared runner keeps the signal reliable.
#
# Commands mirror the ones documented in CONTRIBUTING.md exactly:
#   - node scripts/ci/validate.mjs --profile ci --area dotnet
#   - node scripts/ci/validate.mjs --profile ci --area node,harness
#   - node scripts/ci/validate.mjs --profile ci --area web
#   - node scripts/ci/validate.mjs --profile ci --area docs
#
# A `changes` job classifies the PR/push diff by path group first, and every
# suite job below only runs `if:` its group actually changed (a change to this
# workflow file itself always trips every group). A job whose `if:` is false is
# reported to GitHub as "skipped", which required-status-checks rulesets treat
# as passing, so this stays safe for branch protection while saving CI minutes
# on diffs (e.g. docs-only PRs) that can't affect the skipped suites.
# `Changeset advisory` always runs regardless of paths, since it must evaluate
# every PR for whether a changeset was needed.

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. a new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      web: ${{ steps.filter.outputs.web }}
      node-toolchain: ${{ steps.filter.outputs.node-toolchain }}
      docs: ${{ steps.filter.outputs.docs }}
      diagrams: ${{ steps.filter.outputs.diagrams }}
    steps:
      - uses: actions/checkout@v7
      # dorny/paths-filter classifies the PR/push diff into named groups below.
      # Every group includes .github/workflows/** so a change to this pipeline
      # itself always trips every downstream job, never leaving a suite skipped
      # just because the workflow that runs it changed.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'apps/**/*.cs'
              - 'packages/**/*.cs'
              - 'tests/**'
              - '**/*.csproj'
              - '**/*.sln'
              - 'global.json'
              - 'nuget.config'
              - '.github/workflows/**'
            web:
              - 'apps/web/**'
              - 'scripts/ci/shared-deps.mjs'
              - 'scripts/ci/validate.mjs'
              - '.github/workflows/**'
            node-toolchain:
              - 'scripts/azure/**'
              - 'scripts/changesets/**'
              - 'scripts/ci/**'
              - 'scripts/demo-recording/**'
              - 'scripts/ui-harness/**'
              - 'scripts/harness-judge/**'
              - 'scripts/harness-shared/**'
              - 'scripts/persona-briefs/**'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - 'scripts/ci/shared-deps.mjs'
              - 'scripts/ci/validate.mjs'
              - '.github/workflows/**'
            diagrams:
              - 'docs/diagrams/**'
              - 'docs/diagram-renderer/**'
              - 'README.md'
              - 'docs/guide/architecture-aks.md'
              - 'scripts/docs/**'
              - '.github/workflows/**'

  dotnet-tests:
    name: .NET tests
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.*', '**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      # Restore is locked, build runs once, and tests reuse that exact output.
      # bin/obj remain private to this checkout.
      - name: Run .NET validation
        run: node scripts/ci/validate.mjs --profile ci --area dotnet

      # Every sandbox proof that needs a real bubblewrap runtime carries
      # [Trait("Category", "KataRuntime")], so this gate can never drift away from a
      # renamed test the way a hardcoded FullyQualifiedName list did. AGENTWEAVER_REQUIRE_BWRAP=1
      # turns "bubblewrap missing/unusable" from a silent early return into a failure.
      - name: Run Kata Linux runtime regressions
        env:
          AGENTWEAVER_REQUIRE_BWRAP: "1"
          KATA_RUNTIME_FILTER: Category=KataRuntime
          KATA_RUNTIME_MIN_TESTS: "34"
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          # The gate is worthless if bwrap is absent or cannot create a user namespace.
          # `bwrap --version` proves the binary; the product's own availability probe
          # (asserted by KataRuntimeGate_HasARealBubblewrapRuntimeWhenTheGateRequiresOne)
          # proves the namespaces, using exactly the flags the executor uses.
          bwrap --version
          # Ubuntu 24.04 runners ship kernel.apparmor_restrict_unprivileged_userns=1, which
          # denies the uid map bwrap needs ("setting up uid map: Permission denied"). This is
          # runner configuration only: it changes nothing about the production pod, which is
          # unprivileged, drops ALL capabilities and runs under Kata. Without it the gate can
          # only ever report "runtime unusable", which is precisely the silent hole this step
          # exists to close, so a failure to relax it is left to fail the job below.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Smoke-test the exact namespace set the executor uses before spending a test run.
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev \
            -- /bin/true
          echo "bubblewrap user+pid namespaces are usable on this runner."
          echo "::group::Tests selected by ${KATA_RUNTIME_FILTER}"
          dotnet test tests/Agentweaver.Tests/Agentweaver.Tests.csproj \
            --no-build --no-restore -p:CopilotSkipCliDownload=true \
            --list-tests --filter "${KATA_RUNTIME_FILTER}" \
            | tee kata-runtime-selected.txt
          echo "::endgroup::"
          selected=$(grep -cE '^[[:space:]]+Agentweaver\.Tests\.' kata-runtime-selected.txt || echo 0)
          echo "Selected ${selected} Kata runtime tests (minimum ${KATA_RUNTIME_MIN_TESTS})."
          if [ "${selected}" -lt "${KATA_RUNTIME_MIN_TESTS}" ]; then
            echo "::error::${KATA_RUNTIME_FILTER} selected ${selected} tests, expected at least ${KATA_RUNTIME_MIN_TESTS}. The trait was probably dropped from a sandbox regression."
            exit 1
          fi
          dotnet test tests/Agentweaver.Tests/Agentweaver.Tests.csproj \
            --no-build \
            --no-restore \
            -p:CopilotSkipCliDownload=true \
            --filter "${KATA_RUNTIME_FILTER}" \
            --logger "trx;LogFileName=kata-runtime.trx" \
            --results-directory kata-runtime-results

      - name: Upload Kata runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kata-runtime-regressions
          path: |
            kata-runtime-selected.txt
            kata-runtime-results
          if-no-files-found: warn

  node-toolchain-tests:
    name: Node toolchain tests
    needs: changes
    if: needs.changes.outputs.node-toolchain == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scripts/ui-harness/package-lock.json

      - name: Install Chromium for UI harness integration tests
        run: |
          node scripts/ci/shared-deps.mjs ensure --project scripts/ui-harness --isolated
          npx --prefix scripts/ui-harness playwright install --with-deps chromium

      - name: Run Node toolchain and UI harness tests
        run: node scripts/ci/validate.mjs --profile ci --area node,harness

  web-tests:
    name: Web tests
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Tests and lint deliberately share one job so npm ci runs only once.
      # The lightweight Web lint status job below preserves the existing
      # branch-protection check name.
      - name: Run web tests and lint
        run: node scripts/ci/validate.mjs --profile ci --area web

  web-lint:
    name: Web lint
    needs: [changes, web-tests]
    if: always() && needs.changes.outputs.web == 'true' && needs.web-tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm co-located lint passed
        run: echo "Web lint passed in the Web tests job."

  docs-build:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Builds the VitePress site (source of truth for sabbour.me/agentweaver).
      # Catches broken markdown, dead config, and landing-page regressions.
      - name: Build docs site
        run: node scripts/ci/validate.mjs --profile ci --area docs

  diagrams-in-sync:
    name: Architecture diagrams are in sync
    needs: changes
    if: needs.changes.outputs.diagrams == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install root dependencies
        run: node scripts/ci/shared-deps.mjs ensure --project . --isolated

      # README.md's "Block diagram" and architecture-aks.md's "Component
      # diagram"s are pre-rendered as static PNGs from Fluent-styled React
      # Flow graph-specs (docs/diagrams/src/*.json) via docs/diagram-renderer
      # + Playwright, so they match the same card/icon/badge look used live
      # in the product UI instead of generic Mermaid/mermaid-cli output. This
      # check only compares each spec's content hash against the committed
      # <name>.hash.txt sidecar -- it deliberately does NOT re-render and
      # diff pixels/SVG geometry, since that approach (used by an earlier
      # mermaid-cli version of this pipeline) broke across OSes: rendering
      # geometry depends on the host's installed font metrics, which differ
      # between Windows and Linux even for byte-identical input. A hash
      # check only fails when the spec's actual content (nodes/edges/labels)
      # changed since the PNG was last built, and needs no browser here.
      - name: Check rendered diagrams match source
        run: npm run docs:check-diagrams

  changeset-advisory:
    name: Changeset advisory
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || startsWith(github.base_ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/ci/shared-deps.mjs ensure --project . --isolated
      - run: npm run version:check
      - run: npm run changeset:check -- --base origin/${{ github.base_ref }}
