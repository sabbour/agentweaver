name: CI

# Runs the repository's real verification suites on every pull request and on
# pushes to dev and main. Each area runs in its own job so it gets a dedicated runner:
# the .NET and web test suites contain timing-sensitive tests (heartbeat /
# deadline / render-timeout budgets) that flake only under CPU contention, so
# keeping the suites off a single shared runner keeps the signal reliable.
#
# Commands mirror the ones documented in CONTRIBUTING.md exactly:
#   - node scripts/ci/validate.mjs --profile ci --area node,harness
#   - node scripts/ci/validate.mjs --profile ci --area web
#   - node scripts/ci/validate.mjs --profile ci --area docs
#   - node scripts/ci/validate.mjs --profile ci --area diagrams
# .NET tests are split by stable product namespaces and explicit isolation categories. This keeps
# the seven required shard contexts stable while parallelizing the real work.
#
# A `changes` job classifies the PR/push diff by path group first. The seven
# .NET shard jobs are the exception: `dev`'s ruleset requires their individual
# names, so every PR targeting `dev` runs the unchanged shard matrix. This
# prevents path-inapplicable PRs from reporting a skipped matrix placeholder
# instead of the required contexts. Other suite jobs run only when their path
# group changed (a change to this file, `.github/workflows/ci.yml`, always trips
# every group). A job whose `if:` is false is reported to GitHub as "skipped",
# which required-status-checks rulesets treat as passing.
# `Changeset advisory` always runs regardless of paths, since it must evaluate
# every PR for whether a changeset was needed.
# .NET checks run for draft PRs too: stacked draft layers need a real validation
# signal before they can safely be made ready. The other expensive test/build jobs
# (web/node-toolchain/docs) remain skipped for drafts.
#
# Coverage is collected by instrumenting these SAME jobs' SINGLE test
# invocation, never by a second test pass: a weekly schedule run and an
# opt-in `collect_coverage` workflow_dispatch input both set
# `needs.changes.outputs.collect_coverage` to `true`, which (a) forces the
# .NET/web/node-toolchain jobs to run regardless of path filters or draft
# state, (b) adds coverage flags to the one `dotnet test`/`vitest`/`node
# --test` command each job already runs, and (c) uploads the resulting
# reports as bounded-retention artifacts combined/summarized by the
# `dotnet-coverage-combine` and `coverage-summary` jobs at the end of this
# file. Ordinary pull_request/push runs never set collect_coverage, so their
# command lines are byte-identical to the pre-coverage behavior.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [dev, main]
  schedule:
    # Every Monday at 05:00 UTC — a full cross-surface coverage baseline,
    # off the back of any busy PR-hours window. This is a single ci.yml
    # invocation with coverage instrumentation on, not a second workflow
    # re-running the same suites.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      collect_coverage:
        description: 'Collect and summarize cross-surface coverage reports'
        type: boolean
        default: false

permissions:
  contents: read

# Reports are a periodic diagnostic baseline, not a compliance archive: bound
# retention instead of relying on the repository-wide default.
env:
  COVERAGE_ARTIFACT_RETENTION_DAYS: 14

# Cancel superseded runs for the same ref (e.g. a new push to an open PR).
# Scheduled/manual coverage runs get their own concurrency group suffix so an
# ordinary push to the same ref (e.g. dev) during a long coverage run can
# never cancel it out from under the weekly baseline.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'coverage' || 'default' }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      web: ${{ steps.filter.outputs.web }}
      node-toolchain: ${{ steps.filter.outputs.node-toolchain }}
      docs: ${{ steps.filter.outputs.docs }}
      diagrams: ${{ steps.filter.outputs.diagrams }}
      collect_coverage: ${{ steps.coverage-mode.outputs.collect_coverage }}
    steps:
      - uses: actions/checkout@v4
      # Coverage is opt-in only: the weekly schedule always collects it, and
      # workflow_dispatch collects it only when the caller explicitly asks.
      # Ordinary pull_request/push events never set this, so their job `if:`
      # conditions and command lines stay exactly as they were before
      # coverage existed.
      - id: coverage-mode
        name: Determine coverage collection mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name == 'workflow_dispatch' && inputs.collect_coverage }}" = "true" ]; then
            echo "collect_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "collect_coverage=false" >> "$GITHUB_OUTPUT"
          fi
      # dorny/paths-filter classifies the PR/push diff into named groups below.
      # Every group includes this workflow's own path (.github/workflows/ci.yml)
      # so a change to this pipeline always trips every downstream job, never
      # leaving a suite skipped just because the workflow that runs it changed.
      # It is deliberately NOT `.github/workflows/**`: the other workflows here
      # (agent-host-maintenance, docs-drift, publish-images, squad-*, ...) do not
      # run any of these suites, so editing them used to trigger the entire
      # matrix -- a comment-only edit to an unrelated workflow cost a full .NET,
      # web, node, docs and diagram run. Only ci.yml decides what these jobs do.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'apps/**/*.cs'
              - 'packages/**/*.cs'
              - 'tests/**'
              - '**/*.csproj'
              - '**/*.sln'
              - 'global.json'
              - 'nuget.config'
              - 'scripts/ci/dotnet-test-shards.mjs'
              - 'scripts/ci/tests/dotnet-test-shards.test.mjs'
              - 'tests/Agentweaver.Tests/process-environment.runsettings'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'scripts/ci/shared-deps.mjs'
              - 'scripts/ci/validate.mjs'
              - '.github/workflows/ci.yml'
            node-toolchain:
              - 'scripts/azure/**'
              - 'scripts/changesets/**'
              - 'scripts/ci/**'
              - 'scripts/demo-recording/**'
              - 'scripts/ui-harness/**'
              - 'scripts/harness-judge/**'
              - 'scripts/harness-shared/**'
              - 'scripts/persona-briefs/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'scripts/docs/pages-publisher.mjs'
              - 'scripts/docs/pages-publisher.test.mjs'
              - '.github/workflows/deploy-docs.yml'
              - 'scripts/ci/shared-deps.mjs'
              - 'scripts/ci/validate.mjs'
              - '.github/workflows/ci.yml'
            diagrams:
              - 'docs/diagrams/**'
              - 'README.md'
              - 'docs/guide/architecture-aks.md'
              - 'scripts/docs/**'
              - '.github/workflows/ci.yml'

  release-main-ancestry:
    name: Release main ancestry
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify main ancestry
        env:
          RELEASE_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "origin/main is an ancestor of ${RELEASE_BRANCH}."
            exit 0
          fi

          echo "::error title=Release branch is missing main ancestry::origin/main is not an ancestor of ${RELEASE_BRANCH}. Run git merge -X ours origin/main --no-ff -m \"merge: resolve main into ${RELEASE_BRANCH}\"."
          echo "Cause: origin/main is not an ancestor of ${RELEASE_BRANCH}."
          echo "Fix: git merge -X ours origin/main --no-ff -m \"merge: resolve main into ${RELEASE_BRANCH}\""
          exit 1

  dotnet-test-plan:
    name: Plan .NET test shards
    needs: changes
    if: (github.event_name == 'pull_request' && github.base_ref == 'dev') || needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.collect_coverage == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - id: shards
        name: Define stable test shards
        run: echo "matrix=$(node scripts/ci/dotnet-test-shards.mjs matrix)" >> "$GITHUB_OUTPUT"

  dotnet-test-shards:
    name: .NET test shard (${{ matrix.name }})
    needs: [changes, dotnet-test-plan]
    if: needs.dotnet-test-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.dotnet-test-plan.outputs.matrix) }}
    env:
      COLLECT_COVERAGE: ${{ needs.changes.outputs.collect_coverage }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', 'nuget.config', 'Directory.*', '**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore and build .NET test project
        run: |
          dotnet restore tests/Agentweaver.Tests/Agentweaver.Tests.csproj --locked-mode -p:CopilotSkipCliDownload=true
          dotnet build tests/Agentweaver.Tests/Agentweaver.Tests.csproj --no-restore -p:CopilotSkipCliDownload=true

      - name: Cache bubblewrap
        if: matrix.requiresBubblewrap
        uses: actions/cache@v6
        id: bwrap-cache
        with:
          path: /usr/bin/bwrap
          key: bwrap-${{ runner.os }}-apt

      - name: Install bubblewrap
        if: matrix.requiresBubblewrap && steps.bwrap-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Verify bubblewrap runtime
        if: matrix.requiresBubblewrap
        run: |
          set -euo pipefail
          bwrap --version
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev \
            -- /bin/true

      - name: Run Kata Linux runtime regressions
        if: matrix.requiresBubblewrap
        uses: nick-fields/retry@v3
        env:
          AGENTWEAVER_REQUIRE_BWRAP: "1"
        with:
          timeout_minutes: 3
          max_attempts: 2
          command: |
            node scripts/ci/run-dotnet-test-shard.mjs --shard "${{ matrix.id }}" ${{ env.COLLECT_COVERAGE == 'true' && '--collect-coverage' || '' }}

      - name: Run .NET test shard
        if: ${{ !matrix.requiresBubblewrap }}
        run: node scripts/ci/run-dotnet-test-shard.mjs --shard "${{ matrix.id }}" ${{ env.COLLECT_COVERAGE == 'true' && '--collect-coverage' || '' }}

      - name: Upload test results and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results-${{ matrix.id }}
          path: TestResults/${{ matrix.id }}
          if-no-files-found: error

      # Only present (and only required) when this run is actually collecting
      # coverage; an ordinary PR/push run never reaches this step's condition.
      - name: Upload .NET shard coverage report
        if: always() && env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage-${{ matrix.id }}
          path: TestResults/${{ matrix.id }}/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.COVERAGE_ARTIFACT_RETENTION_DAYS) }}

  dotnet-tests:
    name: .NET tests
    needs: [changes, dotnet-test-plan, dotnet-test-shards]
    if: always() && needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require every .NET test shard
        run: |
          test "${{ needs.dotnet-test-plan.result }}" = "success"
          test "${{ needs.dotnet-test-shards.result }}" = "success"

  node-toolchain-tests:
    name: Node toolchain tests
    needs: changes
    # The draft-PR skip only ever meant to defer this job on an *open draft
    # pull_request*, never on a push/schedule/dispatch run (where
    # `github.event.pull_request` doesn't exist and the comparison is simply
    # false). It is bypassed here only when collect_coverage forces this job
    # to run — never generally for every non-pull_request event, which would
    # have changed ordinary push-to-dev/main behavior beyond this redesign's
    # scope.
    if: (needs.changes.outputs.node-toolchain == 'true' || needs.changes.outputs.collect_coverage == 'true') && (needs.changes.outputs.collect_coverage == 'true' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    env:
      COLLECT_COVERAGE: ${{ needs.changes.outputs.collect_coverage }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/ui-harness/package-lock.json

      - name: Install root npm dependencies
        run: node scripts/ci/shared-deps.mjs ensure --project . --isolated

      - name: Install harness npm dependencies
        run: node scripts/ci/shared-deps.mjs ensure --project scripts/ui-harness --isolated

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/ui-harness/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx --prefix scripts/ui-harness playwright install --with-deps chromium

      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx --prefix scripts/ui-harness playwright install-deps chromium

      # Coverage instrumentation applies only to the `node` area's single
      # `node --test` invocation (wrapped in c8); the harness suite is a
      # separate, non-coverage surface and is never wrapped.
      - name: Run Node toolchain and UI harness tests
        run: node scripts/ci/validate.mjs --profile ci --area node,harness ${{ env.COLLECT_COVERAGE == 'true' && '--collect-coverage' || '' }}

      - name: Upload Node coverage report
        if: always() && env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: node-coverage
          path: coverage/node
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.COVERAGE_ARTIFACT_RETENTION_DAYS) }}

  web-tests:
    name: Web tests
    needs: changes
    if: (needs.changes.outputs.web == 'true' || needs.changes.outputs.collect_coverage == 'true') && (needs.changes.outputs.collect_coverage == 'true' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    env:
      COLLECT_COVERAGE: ${{ needs.changes.outputs.collect_coverage }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Typecheck, tests, and lint share one job so npm ci runs only once.
      # In coverage mode, the test step runs the dedicated `coverage` vitest
      # script (with --coverage) INSTEAD OF the plain `test` script — still
      # one vitest invocation, never both.
      - name: Run web typecheck, tests, and lint
        run: node scripts/ci/validate.mjs --profile ci --area web ${{ env.COLLECT_COVERAGE == 'true' && '--collect-coverage' || '' }}

      - name: Upload web coverage report
        if: always() && env.COLLECT_COVERAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.COVERAGE_ARTIFACT_RETENTION_DAYS) }}

  docs-build:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # Builds the VitePress site (source of truth for sabbour.me/agentweaver).
      # Catches broken markdown, dead config, and landing-page regressions.
      - name: Build docs site
        run: node scripts/ci/validate.mjs --profile ci --area docs

      - name: Test Pages publisher
        run: node --test scripts/docs/pages-publisher.test.mjs

  diagram-checks:
    name: Documentation diagrams
    needs: changes
    if: needs.changes.outputs.diagrams == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install diagram tooling dependencies
        run: node scripts/ci/shared-deps.mjs ensure --project . --isolated

      - name: Test generators and verify rendered artifact stamps
        run: node scripts/ci/validate.mjs --profile ci --area diagrams

  changeset-advisory:
    name: Changeset advisory
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || startsWith(github.base_ref, 'release/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/ci/shared-deps.mjs ensure --project . --isolated
      - run: npm run version:check
      - run: npm run changeset:check -- --base origin/${{ github.base_ref }}

  dotnet-coverage-combine:
    name: .NET coverage combine
    needs: [changes, dotnet-test-shards]
    if: always() && needs.changes.outputs.collect_coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Downloads every per-shard artifact uploaded above in THIS SAME run
      # (never a second test execution) into one directory per shard name,
      # then re-lays them into the layout `combineDotnetReports` expects
      # before merging with pinned ReportGenerator.
      - name: Download .NET shard coverage reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dotnet-coverage-*
          path: downloaded/dotnet-shards

      - name: Combine .NET shard coverage reports
        run: node scripts/ci/coverage-combine.mjs --downloaded-dir downloaded/dotnet-shards --out TestResults/coverage

      - name: Upload combined .NET coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage-combined
          path: TestResults/coverage
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.COVERAGE_ARTIFACT_RETENTION_DAYS) }}

  coverage-summary:
    name: Coverage summary
    needs: [changes, dotnet-coverage-combine, web-tests, node-toolchain-tests]
    if: always() && needs.changes.outputs.collect_coverage == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download .NET coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dotnet-coverage-combined
          path: downloaded/dotnet

      - name: Download web coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-coverage
          path: downloaded/web

      - name: Download Node coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: node-coverage
          path: downloaded/node

      # This job only reports; it intentionally never fails the workflow run
      # on behalf of a partial/failed coverage area above — each area job
      # already reports its own true status, and this step renders exactly
      # that (no invented pass/fail threshold, no masking of partial results).
      - name: Write coverage summary
        if: always()
        run: |
          node scripts/ci/coverage-summary.mjs \
            --sha "${{ github.sha }}" \
            --dotnet-status "${{ needs.dotnet-coverage-combine.result }}" \
            --dotnet-dir downloaded/dotnet \
            --web-status "${{ needs.web-tests.result }}" \
            --web-dir downloaded/web \
            --node-status "${{ needs.node-toolchain-tests.result }}" \
            --node-dir downloaded/node \
            --out "$GITHUB_STEP_SUMMARY"
