name: Publish images

# Builds and publishes the four Agentweaver container images to GitHub's
# container/artifact registry (ghcr.io), one published repository per image:
#
#   ghcr.io/<owner>/agentweaver-api
#   ghcr.io/<owner>/agentweaver-frontend
#   ghcr.io/<owner>/agentweaver-mcp
#   ghcr.io/<owner>/agentweaver-agent-host
#
# The image list is never restated here: the `plan` job derives the build
# matrix from scripts/azure/image-spec.mjs (the deploy toolchain's single
# source of truth) via scripts/ci/ghcr-plan.mjs, so adding or renaming an
# image in that spec automatically changes what this workflow publishes.
#
# Triggers map 1:1 to the `dev -> release/vX.Y.Z -> main` topology documented
# in CONTRIBUTING.md ("Branch Topology") and RELEASING.md:
#
#   push to dev              -> :sha-<short>, :dev
#   push to release/vX.Y.Z   -> :sha-<short>, :rc-X.Y.Z
#   push to main             -> :sha-<short>, :main
#   GitHub Release published -> :sha-<short>, :X.Y.Z, :vX.Y.Z, :latest
#                               (:latest is skipped for prereleases)
#   workflow_dispatch (any ref, i.e. an arbitrary commit)
#                            -> :sha-<short>
#
# Every build always publishes the immutable `sha-<short>` tag, so any image
# is addressable by the exact commit it was built from -- the same identifier
# model `npm run azure:deploy-from-local` / `deploy-from-commit` already use.
# Release publication is driven by the `release: published` event rather than
# by the `v*` tag push, because `npm run release:publish` creates the
# annotated tag and the GitHub Release together and we do not want two
# competing runs racing to move `:latest`.
#
# This workflow is deliberately independent of the Azure/ACR deploy toolchain:
# it publishes images to GitHub, it does not deploy to any cluster.

on:
  push:
    branches:
      - dev
      - main
      - 'release/v*'
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - '**/*.md'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push the built images to ghcr.io (uncheck for a build-only dry run)'
        type: boolean
        default: true

permissions:
  contents: read

# Never let two runs for the same ref publish overlapping tags. Release runs
# are never cancelled mid-flight.
concurrency:
  group: publish-images-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  plan:
    name: Plan image tags
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      tags: ${{ steps.plan.outputs.tags }}
      primary_tag: ${{ steps.plan.outputs.primary_tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Emits `channel`, `tags` and a `matrix` (one entry per image in
      # image-spec.mjs, each with its fully-qualified ghcr.io tag list).
      - name: Resolve publishing channel and tags
        id: plan
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/ci/ghcr-plan.mjs

      - name: Summarize plan
        run: |
          {
            echo "### Image publishing plan"
            echo
            echo "- Channel: \`${{ steps.plan.outputs.channel }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Tags: \`${{ steps.plan.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Scopes the build matrix to images whose sources actually changed, so a
  # single-image commit (e.g. only apps/Agentweaver.Mcp) doesn't rebuild all
  # 4 containers. Filters mirror the per-image `watchedPaths` in
  # scripts/azure/image-spec.mjs (the same single source of truth the ACR
  # deploy toolchain uses for its own build-vs-retag decision), so the two
  # never disagree about what feeds each image.
  #
  # Runs unconditionally so that `build` (which needs this job) is never
  # skipped due to a skipped dependency. The filter step only runs on push;
  # for release/workflow_dispatch the outputs are empty and the build step's
  # own `if` handles those events without referencing these outputs.
  changes:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      agentweaver-api: ${{ steps.filter.outputs.agentweaver-api }}
      agentweaver-frontend: ${{ steps.filter.outputs.agentweaver-frontend }}
      agentweaver-mcp: ${{ steps.filter.outputs.agentweaver-mcp }}
      agentweaver-agent-host: ${{ steps.filter.outputs.agentweaver-agent-host }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            agentweaver-api:
              - 'agentweaver.sln'
              - 'global.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'nuget.config'
              - 'packages/**'
              - 'VERSION'
              - 'apps/Agentweaver.Api/**'
              - 'apps/Agentweaver.Api.Data/**'
              - 'apps/Agentweaver.Api.Migrations.Postgres/**'
            agentweaver-frontend:
              - 'apps/web/**'
              - 'apps/Agentweaver.Web/**'
            agentweaver-mcp:
              - 'agentweaver.sln'
              - 'global.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'nuget.config'
              - 'packages/**'
              - 'VERSION'
              - 'apps/Agentweaver.Mcp/**'
            agentweaver-agent-host:
              - 'agentweaver.sln'
              - 'global.json'
              - 'Directory.Build.props'
              - 'Directory.Packages.props'
              - 'nuget.config'
              - 'packages/**'
              - 'VERSION'
              - 'apps/Agentweaver.AgentHost/**'

  build:
    name: ${{ matrix.name }}
    needs: [plan, changes]
    # Always run the job so the matrix can expand; per-image path filtering
    # is enforced at the build step level (where matrix context is valid).
    # `changes` is skipped for release/workflow_dispatch events, so we must
    # not gate the job on it — only on whether a push event happened at all.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # apps/web/Dockerfile deliberately never runs npm itself: it copies the
      # prebuilt apps/web/dist produced here, matching what the ACR build path
      # does (scripts/azure/steps/20-build-push-images.mjs -> prepareFrontendDist).
      - uses: actions/setup-node@v7
        if: matrix.frontendBuild
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build frontend assets
        if: matrix.frontendBuild
        working-directory: apps/web
        env:
          VITE_API_URL: ''
          VITE_API_KEY: ''
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'workflow_dispatch' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # IMAGE_TAG/GIT_SHA feed the org.opencontainers.image.version/revision
      # labels and the runtime provenance env vars every Dockerfile declares,
      # so a running container can always report the exact build it came from.
      # The GitHub Actions layer cache keeps unchanged images (notably the
      # heavy agent-host) cheap on the runs where they do build.
      # `matrix` context is available in step-level `if` (not job-level), so
      # the path-filter guard lives here: main/release/dispatch always build;
      # dev/release-branch pushes only build images whose sources changed.
      - name: Build and push ${{ matrix.name }}
        if: >-
          github.event_name != 'push' ||
          github.ref == 'refs/heads/main' ||
          needs.changes.outputs[matrix.name] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ matrix.tags }}
          build-args: |
            IMAGE_TAG=${{ needs.plan.outputs.primary_tag }}
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
