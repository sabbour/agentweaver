name: v1 partial publication continuation

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact source SHA of the original partial v1.0.0 publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  continue-publication:
    concurrency:
      group: v1-product-publication-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: read
    environment: v1-publication
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require the exact one-use recovery dispatch
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          test "$GITHUB_REPOSITORY" = "sabbour/agentweaver" || { echo "::error::Continuation requires sabbour/agentweaver"; exit 1; }
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || { echo "::error::Continuation requires a manual dispatch"; exit 1; }
          test "$GITHUB_REF" = "refs/heads/v1" || { echo "::error::Continuation requires the v1 branch"; exit 1; }
          test "$GITHUB_RUN_ATTEMPT" = "1" || { echo "::error::Continuation cannot be rerun"; exit 1; }
          test "$EXPECTED_SOURCE" = "c24d0000fe5fc6163e4f38594c39dff782d3a46d" || { echo "::error::Original source mismatch"; exit 1; }
          test "$GITHUB_SHA" != "$EXPECTED_SOURCE" || { echo "::error::Continuation must use the separately reviewed helper source"; exit 1; }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the approved publication destinations
        env:
          RELEASE_NUGET_SOURCE: ${{ vars.RELEASE_NUGET_SOURCE }}
          RELEASE_REGISTRY: ghcr.io/sabbour
        run: |
          node -e "if (process.env.RELEASE_NUGET_SOURCE !== 'https://nuget.pkg.github.com/sabbour/index.json' || process.env.RELEASE_REGISTRY !== 'ghcr.io/sabbour') { console.error('::error::Publication destinations do not match the approved P1 targets'); process.exit(1); }"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38815873763
          artifact-ids: 12010379447
          path: artifacts/release/pack/
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38815873763
          artifact-ids: 12010899427
          path: artifacts/release/original/
      - name: Set up product Docker engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          version: 'v29.9.0'
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Prepare the isolated Docker credential directory
        run: mkdir -p "$RUNNER_TEMP/agentweaver-continuation-docker"
      - name: Continue only the eleven missing exact artifacts
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NUGET_SOURCE: ${{ vars.RELEASE_NUGET_SOURCE }}
          RELEASE_NUGET_API_KEY: ${{ github.token }}
          RELEASE_NUGET_USERNAME: ${{ github.repository_owner }}
          RELEASE_REGISTRY: ghcr.io/sabbour
          RELEASE_REGISTRY_USER: ${{ github.repository_owner }}
          RELEASE_REGISTRY_PASSWORD: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/agentweaver-continuation-docker
        run: >-
          node scripts/release/publish.mjs releases/foundation.json artifacts/release/pack
          c24d0000fe5fc6163e4f38594c39dff782d3a46d
          --platform-only
          --continue-partial-publication
          --original-receipt artifacts/release/original/publication.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: v1-partial-publication-completion-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/release/pack/continuation.json
            artifacts/release/pack/publication.json
          if-no-files-found: warn
          retention-days: 30
