name: Agentweaver v1 deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable sha-<commit> tag produced by the v1 image workflow
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: v1-db-maintenance
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Require the v1 branch
        run: test "$GITHUB_REF" = "refs/heads/v1" || { echo "::error::Deployment runs only from v1"; exit 1; }
      - name: Require an approved deploy identity
        env:
          AZURE_DB_MAINTENANCE_CLIENT_ID: ${{ vars.AZURE_DB_MAINTENANCE_CLIENT_ID }}
        run: |
          test -n "$AZURE_DB_MAINTENANCE_CLIENT_ID" || {
            echo "::error::AZURE_DB_MAINTENANCE_CLIENT_ID must identify the approved v1 database-maintenance identity."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: v1
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install tooling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: azure/setup-kubectl@v4
      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: v0.2.10
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DB_MAINTENANCE_CLIENT_ID }}
          tenant-id: 72f988bf-86f1-41af-91ab-2d7cd011db47
          subscription-id: 90ab3701-83f0-4ba1-a90a-f2e68683adab
      - name: Select the approved AKS context
        run: |
          az aks get-credentials \
            --resource-group agentweaver \
            --name agentweaver-aks \
            --subscription 90ab3701-83f0-4ba1-a90a-f2e68683adab \
            --overwrite-existing
          kubelogin convert-kubeconfig --login azurecli
          kubectl config current-context
      - name: Migrate, render, apply, and wait
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: npm run deploy:kustomize -- --image-tag "$IMAGE_TAG" --execute
