name: v1 integration images

on:
  workflow_dispatch:
    inputs:
      expected_source:
        description: Exact v1 workflow source SHA
        required: true
        type: string
      publish:
        description: Publish the ten source-bound product images after approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require exact v1 source
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: |
          test "$GITHUB_REF" = "refs/heads/v1" || { echo "::error::Integration images require the v1 branch"; exit 1; }
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA" || { echo "::error::Integration source mismatch"; exit 1; }
          [[ "$EXPECTED_SOURCE" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Expected a full source SHA"; exit 1; }
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up product Docker engine
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          version: 'v29.9.0'
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v3
      - name: Prepare source-bound product images only
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
          DOCKER_CONFIG: ${{ runner.temp }}/agentweaver-integration-docker
          npm_config_cache: ${{ runner.temp }}/agentweaver-integration-npm-cache
          npm_config_update_notifier: 'false'
        run: npm run release:integration-pack -- --integration-source-sha "$EXPECTED_SOURCE"
      - uses: actions/upload-artifact@v4
        with:
          name: v1-integration-images-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/release/integration/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: prepare
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    environment: v1-publication
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          version: 'v29.9.0'
          set-host: true
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: actions/download-artifact@v4
        with:
          name: v1-integration-images-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/release/integration/
      - name: Publish only the exact source-SHA product images
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_REGISTRY: ghcr.io/sabbour
          RELEASE_REGISTRY_USER: ${{ github.repository_owner }}
          RELEASE_REGISTRY_PASSWORD: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/agentweaver-integration-publish-docker
        run: npm run release:integration-publish -- "$GITHUB_SHA" --integration-images-only --confirm-integration-publication
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: v1-integration-publication-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/release/integration/integration-publication.json
          if-no-files-found: warn
          retention-days: 30
