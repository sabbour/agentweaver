name: Agentweaver v1 container images

on:
  push:
    branches:
      - v1
    paths:
      - .github/workflows/v1-integration-images.yml
      - Directory.Build.*
      - Directory.Packages.props
      - global.json
      - NuGet.Config
      - "**/*.csproj"
      - "**/packages.lock.json"
      - "**/packages.linux-x64.lock.json"
      - Agentweaver.slnx
      - apps/web/**
      - eng/acs/**
      - tests/Agentweaver.Acs.ImageProbe/**
      - packages/**
      - releases/foundation.json
      - services/**
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/v1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: Agentweaver.AgentHost
            repository: agentweaver-agenthost
            mode: docker
            context: .
            dockerfile: services/agenthost/Agentweaver.AgentHost/Dockerfile
          - id: Agentweaver.Identity.Broker
            repository: agentweaver.identity.broker
            mode: docker
            context: .
            dockerfile: services/identity/Agentweaver.Identity.Broker/Dockerfile
          - id: Agentweaver.EventsAndSessions
            repository: agentweaver.eventsandsessions
            mode: dotnet
            project: services/events-and-sessions/Agentweaver.EventsAndSessions/Agentweaver.EventsAndSessions.csproj
          - id: Agentweaver.Gateway
            repository: agentweaver.gateway
            mode: dotnet
            project: services/gateway/Agentweaver.Gateway/Agentweaver.Gateway.csproj
          - id: Agentweaver.Mcp
            repository: agentweaver.mcp
            mode: dotnet
            project: services/mcp/Agentweaver.Mcp/Agentweaver.Mcp.csproj
          - id: Agentweaver.Web
            repository: agentweaver-web
            mode: web
            project: apps/web/host/Agentweaver.Web.Host.csproj
          - id: Agentweaver.Orchestrator
            repository: agentweaver.orchestrator
            mode: docker
            context: .
            dockerfile: services/orchestrator/Agentweaver.Orchestrator/Dockerfile
          - id: Agentweaver.Environment
            repository: agentweaver.environment
            mode: dotnet
            project: services/environment/Agentweaver.Environment/Agentweaver.Environment.csproj
          - id: Agentweaver.Knowledge
            repository: agentweaver.knowledge
            mode: dotnet
            project: services/knowledge/Agentweaver.Knowledge/Agentweaver.Knowledge.csproj
          - id: Agentweaver.Projects.Config
            repository: agentweaver.projects.config
            mode: dotnet
            project: services/projects-config/Agentweaver.Projects.Config/Agentweaver.Projects.Config.csproj

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve image source identity
        id: source
        env:
          COMPONENT_ID: ${{ matrix.id }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          source_sha="$(git rev-parse --verify 'HEAD^{commit}')"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "source_sha must be a full lowercase 40-character commit SHA" >&2
              exit 1
            fi
            if [[ "$source_sha" != "$REQUESTED_SOURCE_SHA" ]]; then
              echo "checked-out commit does not match source_sha" >&2
              exit 1
            fi
            git fetch --no-tags origin v1
            if ! git merge-base --is-ancestor "$source_sha" FETCH_HEAD; then
              echo "source_sha must be an ancestor of origin/v1" >&2
              exit 1
            fi
          fi
          tree="$(git rev-parse --verify "${source_sha}^{tree}")"
          version="$(jq -er --arg id "$COMPONENT_ID" '[.components[] | select(.id == $id) | .version] | if length == 1 then .[0] else error("expected exactly one manifest component \($id)") end' releases/foundation.json)"
          {
            echo "sha=${source_sha}"
            echo "tree=${tree}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Select Orchestrator build path
        id: orchestrator-mode
        if: matrix.id == 'Agentweaver.Orchestrator'
        run: |
          dockerfile=services/orchestrator/Agentweaver.Orchestrator/Dockerfile
          package=eng/acs/nuget/AgentControlSpecification.0.4.0-beta.0.nupkg
          if [[ -f "$dockerfile" && -s "$package" ]]; then
            echo "mode=docker" >> "$GITHUB_OUTPUT"
          elif [[ ! -f "$dockerfile" && ! -s "$package" ]]; then
            echo "mode=dotnet" >> "$GITHUB_OUTPUT"
          else
            echo "Orchestrator Dockerfile and pinned ACS package must both exist for the selected source." >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        if: matrix.mode == 'web'
        with:
          node-version: 24

      - name: Restore project
        if: matrix.mode == 'dotnet' || matrix.mode == 'web'
        run: dotnet restore "${{ matrix.project }}" --locked-mode

      - name: Restore legacy Orchestrator
        if: matrix.id == 'Agentweaver.Orchestrator' && steps.orchestrator-mode.outputs.mode == 'dotnet'
        run: dotnet restore "${{ matrix.project }}" --locked-mode

      - name: Install web dependencies
        if: matrix.mode == 'web'
        working-directory: apps/web
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        if: matrix.mode == 'web'
        working-directory: apps/web
        run: npm run build

      - name: Publish web host
        if: matrix.mode == 'web'
        run: dotnet publish "${{ matrix.project }}" --configuration Release --no-restore --output apps/web/publish

      - name: Read web package version
        if: matrix.mode == 'web'
        id: web-version
        working-directory: apps/web
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and verify pinned OPA
        if: matrix.id == 'Agentweaver.AgentHost' || (matrix.id == 'Agentweaver.Orchestrator' && steps.orchestrator-mode.outputs.mode == 'docker')
        run: |
          mkdir -p eng/acs
          curl --fail --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            https://openpolicyagent.org/downloads/v0.70.0/opa_linux_amd64_static \
            --output eng/acs/opa_linux_amd64_static
          echo '00d114b94fdb1606a48cccdfc73c9ccdc62c38721150131ae578d5ff3df5c084  eng/acs/opa_linux_amd64_static' | sha256sum --check -
          chmod 0755 eng/acs/opa_linux_amd64_static

      - name: Build and push AgentHost
        if: matrix.id == 'Agentweaver.AgentHost'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ghcr.io/sabbour/${{ matrix.repository }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            io.agentweaver.source-tree=${{ steps.source.outputs.tree }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}

      - name: Build and push Orchestrator
        if: matrix.id == 'Agentweaver.Orchestrator' && steps.orchestrator-mode.outputs.mode == 'docker'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ghcr.io/sabbour/${{ matrix.repository }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            io.agentweaver.source-tree=${{ steps.source.outputs.tree }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}

      - name: Build and push Identity Broker
        if: matrix.id == 'Agentweaver.Identity.Broker'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: ghcr.io/sabbour/${{ matrix.repository }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            io.agentweaver.source-tree=${{ steps.source.outputs.tree }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}

      - name: Build and push Web
        if: matrix.mode == 'web'
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/sabbour/${{ matrix.repository }}:sha-${{ steps.source.outputs.sha }}
          build-args: |
            IMAGE_TAG=${{ steps.web-version.outputs.version }}
            GIT_SHA=${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            io.agentweaver.source-tree=${{ steps.source.outputs.tree }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}

      - name: Build and push .NET service
        if: matrix.mode == 'dotnet'
        run: >-
          dotnet publish "${{ matrix.project }}"
          -t:PublishContainer
          --configuration Release
          --no-restore
          -p:EnableSdkContainerSupport=true
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=sabbour/${{ matrix.repository }}
          -p:ContainerImageTag=sha-${{ steps.source.outputs.sha }}
          -p:RepositoryCommit=${{ steps.source.outputs.sha }}
          -p:AgentweaverImageSourceSha=${{ steps.source.outputs.sha }}
          -p:AgentweaverImageSourceTree=${{ steps.source.outputs.tree }}
          -p:AgentweaverImageVersion=${{ steps.source.outputs.version }}

      - name: Build and push legacy Orchestrator
        if: matrix.id == 'Agentweaver.Orchestrator' && steps.orchestrator-mode.outputs.mode == 'dotnet'
        run: >-
          dotnet publish "${{ matrix.project }}"
          -t:PublishContainer
          --configuration Release
          --no-restore
          -p:EnableSdkContainerSupport=true
          -p:ContainerTargetOs=linux
          -p:ContainerTargetArchitecture=x64
          -p:ContainerRegistry=ghcr.io
          -p:ContainerRepository=sabbour/${{ matrix.repository }}
          -p:ContainerImageTag=sha-${{ steps.source.outputs.sha }}
          -p:RepositoryCommit=${{ steps.source.outputs.sha }}
          -p:AgentweaverImageSourceSha=${{ steps.source.outputs.sha }}
          -p:AgentweaverImageSourceTree=${{ steps.source.outputs.tree }}
          -p:AgentweaverImageVersion=${{ steps.source.outputs.version }}

      - name: Report pushed image digest
        env:
          IMAGE: ghcr.io/sabbour/${{ matrix.repository }}:sha-${{ steps.source.outputs.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')"
          echo "- \`$IMAGE\` → \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.id }}" = "Agentweaver.AgentHost" ]; then
            manifest="$(docker buildx imagetools inspect --raw "$IMAGE")"
            manifest_bytes="$(printf '%s' "$manifest" | wc -c | tr -d ' ')"
            blob_bytes="$(printf '%s' "$manifest" | jq -r '[.config, .layers[]] | unique_by(.digest) | map(.size) | add')"
            echo "- AgentHost compressed image pull bytes: $((manifest_bytes + blob_bytes))" >> "$GITHUB_STEP_SUMMARY"
          fi
