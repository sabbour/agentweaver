name: v1 foundation CI

on:
  pull_request:
    branches: [v1, sabbour-v1-opentelemetry-core]
  push:
    branches: [v1]
  workflow_dispatch:
  # Only the weekly v1-coverage.yml caller sets collect_coverage; pull request,
  # push, and manual runs of this workflow always test without instrumentation.
  workflow_call:
    inputs:
      collect_coverage:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: v1-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLLECT_COVERAGE: ${{ inputs.collect_coverage == true }}

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked harness dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/mcp-harness --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for loopback sign-in regression
        run: npx playwright install --with-deps chromium
      - name: Test harness contracts and redirect-hop callback capture
        run: |
          npm run test:harness
          npm run test:harness:signin-browser

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/agent-primitives/go.mod
          cache-dependency-path: tools/agent-primitives/go.sum
      - name: Test the AgentSessions and AgentSuite reference tools
        working-directory: tools/agent-primitives
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.paths.outputs.dotnet }}
      web: ${{ steps.paths.outputs.web }}
      node: ${{ steps.paths.outputs.node }}
      images: ${{ steps.paths.outputs.images }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: paths
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/v1-changes.mjs
      - id: matrix
        run: echo "matrix=$(node scripts/ci/v1-test-plan.mjs matrix)" >> "$GITHUB_OUTPUT"

  images:
    name: v1 image and native runtime validation
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: v1-nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/packages.lock.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config') }}
          restore-keys: v1-nuget-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked root Node.js tooling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Restore locked dependencies
        run: dotnet restore Agentweaver.slnx --locked-mode
      - name: Build foundation
        run: dotnet build Agentweaver.slnx --no-restore --configuration Release
      - name: Build unpublished Foundation Probe image and source receipt
        run: node scripts/azure/build-foundation-probe-image.mjs
      - name: Render Foundation Probe acceptance Job and egress policy
        run: kubectl kustomize deploy/k8s/acceptance/foundation-probe
      - name: Build unpublished Identity broker image
        run: |
          mkdir -p artifacts/images
          docker build --platform linux/amd64 --file services/identity/Agentweaver.Identity.Broker/Dockerfile --tag agentweaver-identity-broker:ci --label org.opencontainers.image.revision="$GITHUB_SHA" .
          docker image inspect agentweaver-identity-broker:ci > artifacts/images/identity-broker.json
      - name: Build unpublished AgentHost amd64 image and verify its native SDK runtime
        run: |
          mkdir -p artifacts/images
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          docker buildx create --name agenthost-image-ci --driver docker-container --use
          trap 'docker buildx rm agenthost-image-ci' EXIT
          docker buildx build --platform linux/amd64 \
            --file services/agenthost/Agentweaver.AgentHost/Dockerfile \
            --tag agentweaver-agenthost:ci --load \
            --output type=oci,dest=artifacts/images/agenthost.oci.tar \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label io.agentweaver.source-tree="$SOURCE_TREE" .
          node scripts/release/measure-agenthost-image.mjs artifacts/images/agenthost.oci.tar artifacts/images/agenthost.json
          IMAGE_CONFIG="$(docker image inspect --format '{{.Id}}' agentweaver-agenthost:ci)"
          node --input-type=module -e 'import fs from "node:fs"; const receipt = JSON.parse(fs.readFileSync("artifacts/images/agenthost.json")); if (receipt.image.configDigest !== process.argv[1]) throw Error("The loaded smoke image differs from the measured OCI image.");' "$IMAGE_CONFIG"
          timeout 60s docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /state:rw,noexec,nosuid,nodev,uid=1654,gid=1654,mode=700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,uid=1654,gid=1654,mode=700 \
            agentweaver-agenthost:ci --verify-native-runtime > artifacts/images/agenthost-native-status.json
          node --input-type=module -e 'import fs from "node:fs"; const status = JSON.parse(fs.readFileSync("artifacts/images/agenthost-native-status.json")); if (status.sdkVersion !== "1.0.18" || status.runtimeVersion !== "1.0.97" || status.ProtocolVersion !== 3 || status.nativeDistribution !== "/app/native" || status.privatePackageCacheAbsent !== true) throw Error("The image does not run its pinned image-owned native SDK protocol.");'
          timeout 60s docker run --rm --platform linux/amd64 --network none --read-only \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /workspace:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=755 \
            --tmpfs /state:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            --tmpfs /configuration:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            --tmpfs /run/agenthost-tls:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            --entrypoint /bin/sh agentweaver-agenthost:ci -ec '
              test "$(id -u):$(id -g)" = "1000:1000"
              test "$(stat -c "%u:%g:%a" /workspace)" = "1000:1000:755"
              umask 022
              printf created > /workspace/.agenthost-profile-test
              printf updated >> /workspace/.agenthost-profile-test
              test "$(stat -c "%u:%g:%a" /workspace/.agenthost-profile-test)" = "1000:1000:644"
              mv /workspace/.agenthost-profile-test /workspace/.agenthost-profile-renamed
              test "$(cat /workspace/.agenthost-profile-renamed)" = createdupdated
              rm /workspace/.agenthost-profile-renamed
              test ! -e /workspace/.agenthost-profile-renamed
              umask 077
              for directory in /state /tmp; do
                test "$(stat -c "%u:%g:%a" "$directory")" = "1000:1000:700"
                printf private > "$directory/.agenthost-profile-test"
                test "$(stat -c "%a" "$directory/.agenthost-profile-test")" = 600
                test "$(cat "$directory/.agenthost-profile-test")" = private
                rm "$directory/.agenthost-profile-test"
              done
              umask 337
              printf "{}" > /configuration/appsettings.json
              printf simulated-certificate > /run/agenthost-tls/tls.crt
              printf simulated-key > /run/agenthost-tls/tls.key
              for file in /configuration/appsettings.json /run/agenthost-tls/tls.crt /run/agenthost-tls/tls.key; do
                test "$(stat -c "%a" "$file")" = 440
                test -s "$file" && test -r "$file"
                cat "$file" > /dev/null
              done
              umask 077
              test -x /app/native/copilot
              for file in /app/native/copilot /app/native/copilot.sha256 /app/native/index.js /app/native/app.js /app/native/prebuilds/linux-x64/cli-native.node; do
                test -s "$file" && test -r "$file" && test ! -w "$file"
              done
              STATUS="$(dotnet /app/Agentweaver.AgentHost.dll --verify-native-runtime)"
              test ! -d /state/.cache/copilot/pkg
              printf "{\"uid\":1000,\"gid\":1000,\"workspaceDirectoryMode\":\"0755\",\"workspaceFileMode\":\"0644\",\"privateDirectoryMode\":\"0700\",\"configurationAndTlsMode\":\"0440\",\"native\":%s}\n" "$STATUS"
            ' > artifacts/images/agenthost-profile-access.json
          node --input-type=module -e 'import fs from "node:fs"; const result = JSON.parse(fs.readFileSync("artifacts/images/agenthost-profile-access.json")); if (result.uid !== 1000 || result.gid !== 1000 || result.native.sdkVersion !== "1.0.18" || result.native.runtimeVersion !== "1.0.97" || result.native.ProtocolVersion !== 3 || result.native.nativeDistribution !== "/app/native" || result.native.privatePackageCacheAbsent !== true) throw Error("The exact AgentHost image cannot execute under its selected workspace owner.");'
          rm artifacts/images/agenthost.oci.tar
      - name: Run pinned native prompt-capacity tests in an isolated AMD64 container
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sdk_image='mcr.microsoft.com/dotnet/sdk:10.0.401-noble@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317'
          docker pull --platform linux/amd64 "$sdk_image"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$sdk_image")" = 'linux/amd64'

          output="$GITHUB_WORKSPACE/artifacts/images/agenthost-native-prompt-capacity"
          runtime_root="$(mktemp -d "$RUNNER_TEMP/agentweaver-agenthost-native-prompt-capacity.XXXXXX")"
          test_output="$output/results"
          test_uid="$(id -u)"
          test_gid="$(id -g)"
          mkdir -p "$output" "$test_output" "$runtime_root"

          created_evidence="$output/created-containers.tsv"
          cleanup_evidence="$output/container-cleanup.tsv"
          printf 'role\tid\tcreated\n' > "$created_evidence"
          printf 'role\tid\tinspect\tremove\tabsence\n' > "$cleanup_evidence"
          owned_ids=()
          owned_roles=()
          track_container() {
            local id="$1"
            local role="$2"
            if [[ ! "$id" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Docker returned an invalid ID for the created $role container: $id" >&2
              return 1
            fi
            owned_ids+=("$id")
            owned_roles+=("$role")
            if ! printf '%s\t%s\tconfirmed\n' "$role" "$id" >> "$created_evidence"; then
              echo "Could not record the created $role container ID $id." >&2
              return 1
            fi
            echo "Tracked created $role container $id"
          }
          cleanup() {
            local original_status=$?
            trap - EXIT INT TERM
            local cleanup_status=0
            local index id role inspected inspect_status removed remove_status listed absence_status
            for ((index = 0; index < ${#owned_ids[@]}; index++)); do
              id="${owned_ids[$index]}"
              role="${owned_roles[$index]}"
              if inspected="$(docker inspect --type=container --format '{{.Id}}' "$id" 2>&1)"; then
                if [[ "$inspected" == "$id" ]]; then
                  inspect_status='verified'
                else
                  inspect_status='mismatch'
                  echo "Inspection returned a different ID for owned $role container $id: $inspected" >&2
                  cleanup_status=1
                fi
              else
                inspect_status='failed'
                echo "Could not inspect owned $role container $id before cleanup: $inspected" >&2
                cleanup_status=1
              fi

              if removed="$(docker rm --force "$id" 2>&1)"; then
                remove_status='removed'
                echo "Removed owned $role container $id"
              else
                remove_status='failed'
                echo "Could not remove owned $role container $id: $removed" >&2
                cleanup_status=1
              fi

              if listed="$(docker container ls --all --no-trunc --filter "id=$id" --format '{{.ID}}' 2>&1)"; then
                if [[ -z "$listed" ]]; then
                  absence_status='confirmed-absent'
                  echo "Confirmed owned $role container $id is absent."
                else
                  absence_status='still-present'
                  echo "Owned $role container $id remains after cleanup: $listed" >&2
                  cleanup_status=1
                fi
              else
                absence_status='verification-failed'
                echo "Could not verify absence of owned $role container $id: $listed" >&2
                cleanup_status=1
              fi

              if ! printf '%s\t%s\t%s\t%s\t%s\n' \
                "$role" "$id" "$inspect_status" "$remove_status" "$absence_status" >> "$cleanup_evidence"; then
                echo "Could not record cleanup evidence for owned $role container $id." >&2
                cleanup_status=1
              fi
            done
            if [[ "$original_status" -ne 0 ]]; then
              if [[ "$cleanup_status" -ne 0 ]]; then
                echo "Container cleanup also failed; preserving original step exit code $original_status." >&2
              fi
              exit "$original_status"
            fi
            if [[ "$cleanup_status" -ne 0 ]]; then
              exit "$cleanup_status"
            fi
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if bundle_container_id="$(docker create --platform linux/amd64 --network none agentweaver-agenthost:ci)"; then
            track_container "$bundle_container_id" 'runtime-bundle'
          else
            echo 'Could not create the AgentHost runtime-bundle container.' >&2
            exit 1
          fi
          docker cp "$bundle_container_id:/app/runtime-manifest.json" "$runtime_root/runtime-manifest.json"
          docker cp "$bundle_container_id:/app/native" "$runtime_root"

          test -s "$runtime_root/runtime-manifest.json"
          test -x "$runtime_root/native/copilot"
          test -s "$runtime_root/native/copilot.sha256"
          test -s "$GITHUB_WORKSPACE/tests/Agentweaver.Identity.Broker.Tests/bin/Release/net10.0/Agentweaver.Identity.Broker.Tests.dll"

          source_tree="$(git rev-parse HEAD^{tree})"
          agenthost_image_config="$(docker image inspect --format '{{.Id}}' agentweaver-agenthost:ci)"
          sdk_image_config="$(docker image inspect --format '{{.Id}}' "$sdk_image")"
          runtime_manifest_sha256="$(sha256sum "$runtime_root/runtime-manifest.json" | cut -d ' ' -f 1)"
          native_executable_sha256="$(sha256sum "$runtime_root/native/copilot" | cut -d ' ' -f 1)"
          test_assembly_sha256="$(sha256sum "$GITHUB_WORKSPACE/tests/Agentweaver.Identity.Broker.Tests/bin/Release/net10.0/Agentweaver.Identity.Broker.Tests.dll" | cut -d ' ' -f 1)"
          export PR_HEAD_SHA source_tree agenthost_image_config sdk_image sdk_image_config
          export runtime_manifest_sha256 native_executable_sha256 test_assembly_sha256
          node --input-type=module -e '
            import fs from "node:fs";
            const [manifestPath, receiptPath] = process.argv.slice(1);
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            fs.writeFileSync(receiptPath, JSON.stringify({
              testedSourceSha: process.env.GITHUB_SHA,
              headSha: process.env.PR_HEAD_SHA,
              sourceTreeSha: process.env.source_tree,
              agentHostImage: "agentweaver-agenthost:ci",
              agentHostImageConfig: process.env.agenthost_image_config,
              sdkTestRunnerImage: process.env.sdk_image,
              sdkTestRunnerImageConfig: process.env.sdk_image_config,
              runtimeBundleRoot: "runtime-manifest.json plus native/",
              runtimeManifestSha256: process.env.runtime_manifest_sha256,
              nativeExecutableSha256: process.env.native_executable_sha256,
              testAssemblySha256: process.env.test_assembly_sha256,
              sdkVersion: manifest.sdkVersion,
              runtimeVersion: manifest.runtimeVersion,
              archiveSha512: manifest.archiveSha512,
              containerPlatform: "linux/amd64",
              network: "none",
              nativePromptEgressBlocked: true
            }, null, 2) + "\n");
          ' "$runtime_root/runtime-manifest.json" "$output/identity.json"

          trx="$test_output/RuntimeNativePromptCapacityTests.trx"
          test_log="$output/native-test-output.log"
          test_status=0
          if test_container_id="$(docker create --platform linux/amd64 --network none --read-only \
            --user "$test_uid:$test_gid" \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs "/tmp:rw,nosuid,nodev,size=1g,uid=$test_uid,gid=$test_gid,mode=700" \
            --mount "type=bind,source=$runtime_root,target=/native,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests/Agentweaver.Identity.Broker.Tests/bin/Release/net10.0,target=/tests,readonly" \
            --mount "type=bind,source=$test_output,target=/results" \
            --env AGENTWEAVER_NATIVE_RUNTIME_ROOT=/native \
            --env AGENTWEAVER_NATIVE_PROMPT_EGRESS_BLOCKED=true \
            --env AGENTWEAVER_TEST_UID="$test_uid" \
            --env AGENTWEAVER_TEST_GID="$test_gid" \
            --env HOME=/tmp/home \
            --env DOTNET_CLI_HOME=/tmp/dotnet-cli-home \
            --env DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 \
            --entrypoint /bin/sh "$sdk_image" -ec '
              mkdir -p /tmp/home /tmp/dotnet-cli-home
              test "$(uname -m)" = "x86_64"
              test "$(id -u)" = "$AGENTWEAVER_TEST_UID"
              test "$(id -g)" = "$AGENTWEAVER_TEST_GID"
              test "$AGENTWEAVER_NATIVE_RUNTIME_ROOT" = /native
              test "$AGENTWEAVER_NATIVE_PROMPT_EGRESS_BLOCKED" = true
              test -x /native
              test -r /native/runtime-manifest.json
              test -x /native/native
              test -r /native/native/copilot
              test -x /native/native/copilot
              test -r /native/native/copilot.sha256
              test -r /native/native/index.js
              test -r /native/native/app.js
              test -x /native/native/prebuilds
              test -x /native/native/prebuilds/linux-x64
              test -r /native/native/prebuilds/linux-x64/cli-native.node
              test -w /tmp/home
              test -w /tmp/dotnet-cli-home
              result_probe="/results/.native-prompt-capacity-write-check-$$"
              : > "$result_probe"
              rm "$result_probe"
              dotnet vstest /tests/Agentweaver.Identity.Broker.Tests.dll \
                --TestCaseFilter:"FullyQualifiedName~ByokNativeRuntimeCompactsRemovableHistoryWithinTheAcceptedCapacity|FullyQualifiedName~ByokNativeRuntimeReportsCapacityAttributedQueryErrorForIrreduciblePrompt" \
                --ResultsDirectory:/results \
                --Logger:"trx;LogFileName=RuntimeNativePromptCapacityTests.trx"
            ')"; then
            if track_container "$test_container_id" 'native-test'; then
              if timeout 360s docker start --attach "$test_container_id" 2>&1 | tee "$test_log"; then
                test_status=0
              else
                test_status=$?
              fi
            else
              test_status=1
            fi
          else
            test_status=$?
            echo "Could not create the native test container (exit $test_status); no container ID was returned." >&2
          fi

          verification_status=0
          if test -s "$trx"; then
            NATIVE_TEST_EXIT_CODE="$test_status" node scripts/ci/verify-agenthost-native-prompt-capacity-trx.mjs \
              "$trx" "$output/identity.json" "$test_log" || verification_status=$?
          else
            echo "The native test run did not produce a nonempty TRX result." >&2
            verification_status=1
          fi

          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          exit "$verification_status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: v1-local-image-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/images/
          if-no-files-found: error
          retention-days: 30

  node:
    name: v1 release and P1 contracts
    needs: [changes, web]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked root Node.js tooling dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate release composition
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            export RELEASE_BASE_SHA="$(git rev-parse HEAD^1)"
          fi
          npm run release:validate -- --ci
      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.node == 'true'
        with:
          global-json-file: global.json
      - name: Cache NuGet packages for executable tooling fixtures
        if: needs.changes.outputs.node == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: v1-nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/packages.lock.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config') }}
          restore-keys: v1-nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore dependencies required by Linux collector and Web image contracts
        if: needs.changes.outputs.node == 'true'
        run: |
          dotnet restore services/agenthost/Agentweaver.AgentHost/Agentweaver.AgentHost.csproj --locked-mode
          dotnet restore apps/web/host/Agentweaver.Web.Host.csproj --locked-mode
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.node == 'true'
        with:
          name: v1-web-dist
          path: apps/web/dist/
      - name: Preload pinned ASP.NET runtime image for release validator
        if: ${{ !cancelled() && needs.changes.outputs.node == 'true' }}
        run: docker pull --platform linux/amd64 mcr.microsoft.com/dotnet/aspnet:10.0@sha256:222759b391a1aaf241166672c8f99b2d4ada452e7b5319f3c6e8f265a37b5ad4
      - name: Test release validator with coverage
        if: ${{ !cancelled() && env.COLLECT_COVERAGE == 'true' }}
        run: npm run coverage:node
      - name: Test release and Azure tooling without coverage
        if: ${{ !cancelled() && env.COLLECT_COVERAGE != 'true' && needs.changes.outputs.node == 'true' }}
        run: node --test scripts/release/tests/*.test.mjs scripts/azure/tests/*.test.mjs
      - name: Test controlled P1 API, MCP, and UI journeys
        if: ${{ !cancelled() }}
        run: node --test scripts/api-harness/test/p1-journey.test.mjs scripts/harness-shared/test/run-p1.test.mjs scripts/harness-shared/test/p1-deployment-evidence.test.mjs
      - name: Test coverage report guards
        if: ${{ !cancelled() }}
        run: node --test scripts/coverage/tests/*.test.mjs scripts/ci/tests/*.test.mjs
      - name: Test project issue-to-merge workflow
        if: ${{ !cancelled() }}
        run: node --test .github/extensions/agentweaver-issue-to-merge/workflow.test.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.COLLECT_COVERAGE == 'true' }}
        with:
          name: v1-node-coverage
          path: artifacts/coverage/node/
          if-no-files-found: error
          retention-days: 30

  web:
    name: v1 web validation
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # Exact-key only: a lockfile or Node.js change misses and runs a clean npm ci.
      - id: web-modules
        name: Cache installed web dependencies
        uses: actions/cache@v4
        with:
          path: |
            apps/web/node_modules
            !apps/web/node_modules/.cache
            !apps/web/node_modules/.vite
            !apps/web/node_modules/.vitest
          key: v1-web-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Install locked web dependencies
        if: steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Test web once with optional coverage
        run: |
          if [ "$COLLECT_COVERAGE" = true ]; then
            npm --prefix apps/web run coverage
          else
            npm --prefix apps/web test
          fi
      - name: Build and lint v1 web client
        run: |
          npm --prefix apps/web run build
          npm --prefix apps/web run lint
      - uses: actions/upload-artifact@v4
        with:
          name: v1-web-dist
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.COLLECT_COVERAGE == 'true' }}
        with:
          name: v1-web-coverage
          path: artifacts/coverage/web/
          if-no-files-found: error
          retention-days: 30

  dotnet:
    name: v1 .NET tests (${{ matrix.name }})
    needs: [changes, web]
    if: ${{ !cancelled() && needs.changes.outputs.dotnet == 'true' && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: v1-nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/packages.lock.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config') }}
          restore-keys: v1-nuget-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore and build test project
        env:
          TEST_PROJECT: ${{ matrix.project }}
        run: |
          dotnet restore "tests/$TEST_PROJECT/$TEST_PROJECT.csproj" --locked-mode
          dotnet build "tests/$TEST_PROJECT/$TEST_PROJECT.csproj" --no-restore --configuration Release
      - uses: actions/download-artifact@v4
        if: matrix.shard > 0
        with:
          name: v1-web-dist
          path: apps/web/dist/
      # Shares the exact-key web job entry; a miss falls back to npm ci with the download cache.
      - id: web-modules
        name: Cache installed dependencies for Broker Vite fixtures
        if: matrix.shard > 0
        uses: actions/cache@v4
        with:
          path: |
            apps/web/node_modules
            !apps/web/node_modules/.cache
            !apps/web/node_modules/.vite
            !apps/web/node_modules/.vitest
          key: v1-web-modules-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-${{ hashFiles('apps/web/package-lock.json') }}
      - name: Cache npm downloads for Broker Vite fixtures
        if: matrix.shard > 0 && steps.web-modules.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: v1-npm-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: v1-npm-${{ runner.os }}-
      - name: Install locked dependencies for Broker Vite fixtures
        if: matrix.shard > 0 && steps.web-modules.outputs.cache-hit != 'true'
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Cache Playwright browsers
        if: matrix.shard > 0
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: v1-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Agentweaver.Identity.Broker.Tests/packages.lock.json') }}
      - name: Install Chromium and system dependencies
        if: matrix.shard > 0
        run: pwsh tests/Agentweaver.Identity.Broker.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Run tests and verify shard receipt
        env:
          TEST_SUITE: ${{ matrix.name }}
        run: node scripts/ci/v1-test-plan.mjs run "$TEST_SUITE"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: v1-dotnet-${{ matrix.name }}
          path: artifacts/coverage/dotnet/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: v1 coverage summary
    needs: [dotnet, web, node]
    if: ${{ !cancelled() && inputs.collect_coverage == true && needs.dotnet.result == 'success' && needs.web.result == 'success' && needs.node.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: v1-dotnet-*
          path: artifacts/downloads/
      - name: Restore suite directory layout
        run: |
          mkdir -p artifacts/coverage/dotnet
          for suite in artifacts/downloads/v1-dotnet-*; do
            mv "$suite" "artifacts/coverage/dotnet/${suite##*/v1-dotnet-}"
          done
      - uses: actions/download-artifact@v4
        with:
          name: v1-node-coverage
          path: artifacts/coverage/node/
      - uses: actions/download-artifact@v4
        with:
          name: v1-web-coverage
          path: artifacts/coverage/web/
      - name: Combine coverage without rerunning tests
        run: node scripts/coverage/dotnet.mjs --combine
      - name: Record coverage candidate
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("artifacts/coverage/source.json", JSON.stringify({ testedSourceSha: process.env.GITHUB_SHA, headSha: process.env.PR_HEAD_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT }, null, 2) + "\n");'
      - name: Publish coverage summary
        run: |
          {
            echo "## Coverage for tested candidate \`$GITHUB_SHA\`"
            echo "Reports measure exercised code, not behavioral or E2E completeness."
            if [ -f artifacts/coverage/dotnet/combined/SummaryGithub.md ]; then
              cat artifacts/coverage/dotnet/combined/SummaryGithub.md
            else
              echo ".NET coverage report was not produced; inspect the preceding steps."
            fi
            echo "### Node release validator"
            if [ -f artifacts/coverage/node/summary.txt ]; then
              echo '```text'
              cat artifacts/coverage/node/summary.txt
              echo '```'
            else
              echo "Node coverage report was not produced; inspect the preceding steps."
            fi
            echo "### v1 web client"
            if [ -f artifacts/coverage/web/coverage-summary.json ]; then
              echo '```json'
              cat artifacts/coverage/web/coverage-summary.json
              echo '```'
            else
              echo "Web coverage report was not produced; inspect the preceding steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: v1-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 30

  foundation:
    needs: [changes, harness, go, images, node, web, dotnet, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the foundation gate and reject failed or unexpectedly skipped work
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.RESULTS);
            const expected = {
              changes: true, harness: true, go: true, node: true,
              images: jobs.changes.outputs.images === "true",
              web: jobs.changes.outputs.web === "true",
              dotnet: jobs.changes.outputs.dotnet === "true",
              coverage: process.env.COLLECT_COVERAGE === "true"
            };
            for (const [name, required] of Object.entries(expected)) {
              const actual = jobs[name].result;
              if (actual !== (required ? "success" : "skipped")) {
                throw Error(`${name}: expected ${required ? "success" : "skipped"}, got ${actual}`);
              }
            }
          '
