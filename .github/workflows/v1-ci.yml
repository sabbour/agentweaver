name: v1 foundation CI

on:
  pull_request:
    branches: [v1, sabbour-v1-opentelemetry-core]
  push:
    branches: [v1]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record coverage candidate
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/coverage
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("artifacts/coverage/source.json", JSON.stringify({ testedSourceSha: process.env.GITHUB_SHA, headSha: process.env.PR_HEAD_SHA, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT }, null, 2) + "\n");'
      - name: Install locked web dependencies
        run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Test v1 web client with coverage
        run: npm --prefix apps/web run coverage
      - name: Build and lint v1 web client
        run: |
          npm --prefix apps/web run build
          npm --prefix apps/web run lint
      - name: Validate release composition
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run release:validate -- --base "$RELEASE_BASE_SHA"
      - name: Restore locked dependencies
        run: dotnet restore Agentweaver.slnx --locked-mode
      - name: Build foundation
        run: dotnet build Agentweaver.slnx --no-restore --configuration Release
      - name: Build unpublished Foundation Probe image and source receipt
        run: node scripts/azure/build-foundation-probe-image.mjs
      - name: Render Foundation Probe acceptance Job and egress policy
        run: kubectl kustomize deploy/k8s/acceptance/foundation-probe
      - name: Test .NET foundations, Identity broker, Projects & Config, and Foundation Probe with coverage
        run: npm run coverage:dotnet
      - name: Build unpublished Identity broker image
        run: |
          mkdir -p artifacts/images
          docker build --platform linux/amd64 --file services/identity/Agentweaver.Identity.Broker/Dockerfile --tag agentweaver-identity-broker:ci --label org.opencontainers.image.revision="$GITHUB_SHA" .
          docker image inspect agentweaver-identity-broker:ci > artifacts/images/identity-broker.json
      - name: Build unpublished AgentHost amd64 image and verify its native SDK runtime
        run: |
          mkdir -p artifacts/images
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          docker buildx create --name agenthost-image-ci --driver docker-container --use
          trap 'docker buildx rm agenthost-image-ci' EXIT
          docker buildx build --platform linux/amd64 \
            --file services/agenthost/Agentweaver.AgentHost/Dockerfile \
            --tag agentweaver-agenthost:ci --load \
            --output type=oci,dest=artifacts/images/agenthost.oci.tar \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label io.agentweaver.source-tree="$SOURCE_TREE" .
          node scripts/release/measure-agenthost-image.mjs artifacts/images/agenthost.oci.tar artifacts/images/agenthost.json
          IMAGE_CONFIG="$(docker image inspect --format '{{.Id}}' agentweaver-agenthost:ci)"
          node --input-type=module -e 'import fs from "node:fs"; const receipt = JSON.parse(fs.readFileSync("artifacts/images/agenthost.json")); if (receipt.image.configDigest !== process.argv[1]) throw Error("The loaded smoke image differs from the measured OCI image.");' "$IMAGE_CONFIG"
          timeout 60s docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /state:rw,noexec,nosuid,nodev,uid=1654,gid=1654,mode=700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,uid=1654,gid=1654,mode=700 \
            agentweaver-agenthost:ci --verify-native-runtime > artifacts/images/agenthost-native-status.json
          node --input-type=module -e 'import fs from "node:fs"; const status = JSON.parse(fs.readFileSync("artifacts/images/agenthost-native-status.json")); if (status.sdkVersion !== "1.0.11" || status.runtimeVersion !== "1.0.79" || status.ProtocolVersion !== 3 || status.nativeDistribution !== "/app/native" || status.privatePackageCacheAbsent !== true) throw Error("The image does not run its pinned image-owned native SDK protocol.");'
          timeout 60s docker run --rm --platform linux/amd64 --network none --read-only \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /workspace:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=755 \
            --tmpfs /state:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            --tmpfs /configuration:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            --tmpfs /run/agenthost-tls:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=700 \
            --entrypoint /bin/sh agentweaver-agenthost:ci -ec '
              test "$(id -u):$(id -g)" = "1000:1000"
              test "$(stat -c "%u:%g:%a" /workspace)" = "1000:1000:755"
              umask 022
              printf created > /workspace/.agenthost-profile-test
              printf updated >> /workspace/.agenthost-profile-test
              test "$(stat -c "%u:%g:%a" /workspace/.agenthost-profile-test)" = "1000:1000:644"
              mv /workspace/.agenthost-profile-test /workspace/.agenthost-profile-renamed
              test "$(cat /workspace/.agenthost-profile-renamed)" = createdupdated
              rm /workspace/.agenthost-profile-renamed
              test ! -e /workspace/.agenthost-profile-renamed
              umask 077
              for directory in /state /tmp; do
                test "$(stat -c "%u:%g:%a" "$directory")" = "1000:1000:700"
                printf private > "$directory/.agenthost-profile-test"
                test "$(stat -c "%a" "$directory/.agenthost-profile-test")" = 600
                test "$(cat "$directory/.agenthost-profile-test")" = private
                rm "$directory/.agenthost-profile-test"
              done
              umask 337
              printf "{}" > /configuration/appsettings.json
              printf simulated-certificate > /run/agenthost-tls/tls.crt
              printf simulated-key > /run/agenthost-tls/tls.key
              for file in /configuration/appsettings.json /run/agenthost-tls/tls.crt /run/agenthost-tls/tls.key; do
                test "$(stat -c "%a" "$file")" = 440
                test -s "$file" && test -r "$file"
                cat "$file" > /dev/null
              done
              umask 077
              for file in /app/native/copilot /app/native/index.js /app/native/app.js /app/native/prebuilds/linux-x64/runtime.node; do
                test -s "$file" && test -r "$file" && test ! -w "$file"
              done
              STATUS="$(dotnet /app/Agentweaver.AgentHost.dll --verify-native-runtime)"
              test ! -d /state/.cache/copilot/pkg
              printf "{\"uid\":1000,\"gid\":1000,\"workspaceDirectoryMode\":\"0755\",\"workspaceFileMode\":\"0644\",\"privateDirectoryMode\":\"0700\",\"configurationAndTlsMode\":\"0440\",\"native\":%s}\n" "$STATUS"
            ' > artifacts/images/agenthost-profile-access.json
          node --input-type=module -e 'import fs from "node:fs"; const result = JSON.parse(fs.readFileSync("artifacts/images/agenthost-profile-access.json")); if (result.uid !== 1000 || result.gid !== 1000 || result.native.sdkVersion !== "1.0.11" || result.native.runtimeVersion !== "1.0.79" || result.native.ProtocolVersion !== 3 || result.native.nativeDistribution !== "/app/native" || result.native.privatePackageCacheAbsent !== true) throw Error("The exact AgentHost image cannot execute under its selected workspace owner.");'
          rm artifacts/images/agenthost.oci.tar
      - name: Test release validator with coverage
        if: ${{ !cancelled() }}
        run: npm run coverage:node
      - name: Test coverage report guards
        if: ${{ !cancelled() }}
        run: node --test scripts/coverage/tests/*.test.mjs
      - name: Test project issue-to-merge workflow
        if: ${{ !cancelled() }}
        run: node --test .github/extensions/agentweaver-issue-to-merge/workflow.test.mjs
      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Coverage for tested candidate \`$GITHUB_SHA\`"
            echo "Reports measure exercised code, not behavioral or E2E completeness."
            if [ -f artifacts/coverage/dotnet/combined/SummaryGithub.md ]; then
              cat artifacts/coverage/dotnet/combined/SummaryGithub.md
            else
              echo ".NET coverage report was not produced; inspect the preceding steps."
            fi
            echo "### Node release validator"
            if [ -f artifacts/coverage/node/summary.txt ]; then
              echo '```text'
              cat artifacts/coverage/node/summary.txt
              echo '```'
            else
              echo "Node coverage report was not produced; inspect the preceding steps."
            fi
            echo "### v1 web client"
            if [ -f artifacts/coverage/web/coverage-summary.json ]; then
              echo '```json'
              cat artifacts/coverage/web/coverage-summary.json
              echo '```'
            else
              echo "Web coverage report was not produced; inspect the preceding steps."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: v1-local-image-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/images/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: v1-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 30
