version: 2

updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"

  # Root npm workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
    groups:
      dev-tooling:
        patterns:
          - "typescript"
          - "eslint*"
          - "@typescript-eslint/*"
          - "prettier"
          - "vite*"
          - "@vitejs/*"
          - "vitest*"

  # Web app
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
    groups:
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-*"
          - "@types/react*"
      fluent-ui:
        patterns:
          - "@fluentui/*"
          - "@microsoft/fast-*"

  # .NET (NuGet) — solution root
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
    groups:
      aspnetcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
      azure-sdk:
        patterns:
          - "Azure.*"
          - "Microsoft.Azure.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"

  # Docker — API
  - package-ecosystem: "docker"
    directory: "/apps/Agentweaver.Api"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"

  # Docker — AgentHost
  - package-ecosystem: "docker"
    directory: "/apps/Agentweaver.AgentHost"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"

  # Docker — MCP
  - package-ecosystem: "docker"
    directory: "/apps/Agentweaver.Mcp"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"

  # Docker — Web
  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    rebase-strategy: "disabled"
